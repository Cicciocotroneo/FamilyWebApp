<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Family Hub</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Family Hub">
    <link rel="apple-touch-icon" href="icon.png">
    
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <style>
        :root {
            --bg-body: #f4f6f8;
            --bg-card: #ffffff;
            --text-main: #333333;
            --text-sub: #666666;
            --border: #e0e0e0;
            --primary: #4285f4;
            --accent-bg: #e8f0fe;
            --nav-bg: #ffffff;
            --shadow: rgba(0,0,0,0.05);
            --input-bg: #ffffff;
        }
        body.dark-mode {
            --bg-body: #121212;
            --bg-card: #1e1e1e;
            --text-main: #e0e0e0;
            --text-sub: #a0a0a0;
            --border: #333333;
            --primary: #8ab4f8;
            --accent-bg: #2c2c2c;
            --nav-bg: #1e1e1e;
            --shadow: rgba(0,0,0,0.3);
            --input-bg: #2c2c2c;
        }

        body { background-color: var(--bg-body); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; transition: background 0.3s; }
        * { box-sizing: border-box; } 

        header { 
            background: var(--bg-card); padding: 15px 20px; position: sticky; top: 0; z-index: 100; 
            box-shadow: 0 2px 10px var(--shadow); display: flex; justify-content: space-between; align-items: center; 
            color: var(--text-main);
        }
        .header-controls { display: flex; align-items: center; gap: 15px; }
        .header-controls i { color: var(--text-sub); cursor: pointer; }
        
        .filter-row { padding: 0 15px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .filter-row select { width: auto !important; height: 35px !important; font-size: 0.85rem; border: none; background-color: transparent; color: var(--text-sub); font-weight: 600; padding-right: 25px; }

        #calendar-view-container { background: var(--bg-card); margin: 15px; border-radius: 16px; padding: 15px; box-shadow: 0 4px 20px var(--shadow); }
        .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-weight: bold; font-size: 1.1rem; color: var(--text-main); }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; }
        .cal-day-name { font-size: 0.8rem; color: var(--text-sub); margin-bottom: 5px; }
        .cal-day { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 50%; font-size: 0.95rem; cursor: pointer; position: relative; color: var(--text-main); }
        .cal-day.selected { background-color: var(--primary); color: white !important; font-weight: bold; }
        .cal-day.today { border: 2px solid var(--primary); }
        .cal-day.empty { pointer-events: none; }
        .cal-dots-container { display: flex; gap: 2px; margin-top: 3px; justify-content: center; flex-wrap: wrap; max-width: 80%; }
        .cal-dot { width: 5px; height: 5px; border-radius: 50%; } 
        
        .add-bar { background: var(--bg-card); padding: 15px; margin: 15px; border-radius: 16px; box-shadow: 0 4px 20px var(--shadow); display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
        .add-bar select, .add-bar input, #add-btn, .note-editor input, .note-editor button, .admin-panel input, .admin-panel button { height: 48px !important; width: 100%; border: 1px solid var(--border); border-radius: 12px; background-color: var(--input-bg); font-size: 16px; padding: 0 12px; color: var(--text-main); margin: 0; appearance: none; -webkit-appearance: none; outline: none; }

        #recurrence-wrapper { grid-column: 1 / -1; background: var(--bg-body); border: 1px solid var(--border); border-radius: 12px; padding: 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .rec-input-small { flex: 1; min-width: 60px; text-align: center; }
        .rec-label { font-size: 0.8rem; color: var(--text-sub); white-space: nowrap; }

        .add-bar select { background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23888%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E"); background-repeat: no-repeat; background-position: right 12px top 50%; background-size: 10px auto; }
        #assign-who { background-color: #fff8e1; border-color: #ffecb3; color: #ff6f00; font-weight: 600; }
        body.dark-mode #assign-who { background-color: #4a3b00; border-color: #665200; color: #ffb74d; }
        
        .input-text-group { grid-column: 1 / -1; display: flex; gap: 10px; align-items: stretch; }
        #new-item-input { flex-grow: 1; border: 2px solid var(--primary); background-image: none; }
        #contact-detail-input, #location-input { grid-column: 1 / -1; }
        
        #add-btn { width: 50px !important; padding: 0; background: var(--primary); color: white; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 10px rgba(66, 133, 244, 0.3); }
        #add-btn:active { transform: scale(0.95); }

        .note-editor { background: #fff9c4; padding: 15px; margin: 15px; border-radius: 16px; box-shadow: 0 4px 20px var(--shadow); display: flex; flex-direction: column; gap: 10px; border: 1px solid #fbc02d; }
        body.dark-mode .note-editor { background: #423e00; border-color: #856f00; }
        .note-editor textarea { width: 100%; height: 150px; border: 1px solid var(--border); border-radius: 12px; background-color: var(--input-bg); font-size: 16px; padding: 12px; color: var(--text-main); font-family: inherit; resize: none; outline: none; }
        #save-note-btn { background: #fbc02d; color: #333; font-weight: bold; border: none; box-shadow: 0 4px 10px rgba(251, 192, 45, 0.3); cursor: pointer; }

        .hidden { display: none !important; }

        /* LISTE E CARDS */
        #list-container { padding: 0 15px 120px 15px; } 
        .card { background: var(--bg-card); padding: 16px; margin-bottom: 12px; border-radius: 12px; box-shadow: 0 1px 3px var(--shadow); display: flex; justify-content: space-between; align-items: center; scroll-margin-top: 140px; border: 1px solid transparent; }
        
        .note-card { flex-direction: column; align-items: flex-start; gap: 10px; border-left: 5px solid #fbc02d; }
        .note-title { font-weight: 800; font-size: 1.1rem; color: var(--text-main); width: 100%; }
        .note-body { white-space: pre-wrap; color: var(--text-sub); font-size: 0.95rem; line-height: 1.4; width: 100%; }
        
        .chat-card { flex-direction: row; align-items: flex-start; gap: 10px; padding: 12px; }
        .chat-author { font-weight: bold; color: var(--primary); font-size: 0.85rem; text-transform: capitalize; }
        .chat-time { font-size: 0.75rem; color: var(--text-sub); margin-left: auto; }
        .chat-tag { background: #fff3e0; color: #e65100; padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; display: inline-block; margin-top: 8px; font-weight: bold; border: 1px solid #ffe0b2; }
        body.dark-mode .chat-tag { background: #4a2800; border-color: #7a4100; color: #ffb74d; }

        .date-badge { background: var(--accent-bg); color: var(--primary); padding: 6px 10px; border-radius: 10px; text-align: center; margin-right: 15px; min-width: 50px; display: flex; flex-direction: column; justify-content: center; font-weight: bold; }
        .date-day { font-size: 1.4rem; line-height: 1; }
        .date-month { font-size: 0.7rem; text-transform: uppercase; margin-top: 2px; }
        .today-card { border-left: 5px solid var(--primary); background: var(--bg-body); }
        .time-display { font-size: 0.85rem; background: var(--bg-body); padding: 2px 6px; border-radius: 4px; margin-right: 5px; color: var(--text-main); font-weight: bold; border: 1px solid var(--border); }
        .due-date-display { font-size: 0.75rem; color: #e57373; font-weight: bold; display: block; margin-top: 2px; }
        .location-link { display: inline-flex; align-items: center; color: var(--primary); text-decoration: none; font-size: 0.8rem; margin-top: 6px; background: var(--accent-bg); padding: 4px 8px; border-radius: 6px; }
        
        .cat-dot { height: 12px; width: 12px; border-radius: 50%; display: inline-block; margin-right: 8px; vertical-align: middle; border: 1px solid rgba(0,0,0,0.1); }
        .assigned-badge { font-size: 0.75rem; background: var(--bg-body); color: var(--text-sub); padding: 3px 8px; border-radius: 6px; margin-left: 8px; display: inline-block; vertical-align: middle; border: 1px solid var(--border); }
        
        /* BULK DELETE STYLES */
        .bulk-checkbox { display: none; width: 22px; height: 22px; margin-right: 15px; accent-color: #d32f2f; flex-shrink:0;}
        #list-container.bulk-mode .bulk-checkbox { display: block; }
        #bulk-delete-btn { position: fixed; bottom: 85px; left: 50%; transform: translateX(-50%); background: #d32f2f; color: white; border: none; padding: 12px 24px; border-radius: 30px; font-weight: bold; box-shadow: 0 4px 15px rgba(211,47,47,0.4); z-index: 300; display:flex; align-items:center; gap:8px;}
        .bulk-toggle-btn { display:flex; align-items:center; gap:5px; color:var(--text-sub); font-size:0.85rem; background:none; border:1px solid var(--border); padding:6px 10px; border-radius:8px; cursor:pointer;}
        .bulk-toggle-btn.active { background: #ffebee; color: #d32f2f; border-color: #ffcdd2; }

        /* NAVIGAZIONE SCORREVOLE */
        .bottom-nav { 
            position: fixed; bottom: 0; width: 100%; background: var(--nav-bg); border-top: 1px solid var(--border); 
            display: flex; justify-content: flex-start; gap: 5px; padding: 10px 15px 20px 15px; z-index: 200; 
            box-shadow: 0 -2px 10px var(--shadow); overflow-x: auto; -webkit-overflow-scrolling: touch; 
        }
        .bottom-nav::-webkit-scrollbar { display: none; }
        .nav-item { background: none; border: none; color: #999; display: flex; flex-direction: column; align-items: center; font-size: 0.65rem; padding: 0 8px; min-width: 65px; flex-shrink: 0; }
        .nav-item.active { color: var(--primary); }
        .nav-item i { font-size: 24px; margin-bottom: 2px; }
        
        /* DASHBOARD & SETTINGS */
        .dash-section-title { font-size: 1rem; color: var(--text-main); margin: 25px 0 10px 0; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); padding-bottom: 5px; }
        
        .settings-view { padding: 20px; padding-bottom: 100px; }
        .settings-section { background: var(--bg-card); border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 1px 3px var(--shadow); }
        .settings-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); color: var(--text-main); }
        .admin-panel { border: 2px solid #ff9800; background: #fff3e0; color: #333; }
        
        #auth-container { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 30px; background: white; }
        #auth-container input { width: 100%; height: 50px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 10px; padding: 0 15px; font-size: 16px; }
        #login-btn { width: 100%; height: 50px; background: #4285f4; color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="auth-container">
        <h1 style="color:#4285f4; font-size: 2.5rem; margin-bottom: 10px;">Family Hub</h1>
        <p style="color:#888; margin-bottom: 40px;">Il centro della tua casa.</p>
        <input type="email" id="email-input" placeholder="Email">
        <input type="password" id="password-input" placeholder="Password">
        <button id="login-btn">Entra</button>
        <p onclick="window.resetPassword()" style="color:#4285f4; cursor:pointer; margin-top:15px; text-decoration:underline;">Password dimenticata?</p>
        <p id="login-status" style="margin-top: 20px; color: #666; font-size: 0.9rem;"></p>
    </div>

    <div id="app-container" class="hidden">
        <header>
            <div>
                <h2 id="page-title" style="margin:0; font-size: 1.4rem;">Home</h2>
                <span id="family-display" style="font-size:0.75rem; font-weight: 500; opacity: 0.7;">Caricamento...</span>
            </div>
            <div class="header-controls">
                <i id="theme-toggle" class="material-icons" onclick="window.toggleTheme()">brightness_4</i>
                <i id="calendar-toggle-btn" class="material-icons hidden" onclick="window.toggleCalendarView()" style="color:var(--primary); cursor:pointer; font-size:28px;">calendar_month</i>
                <i class="material-icons" onclick="window.nav('settings')">settings</i>
                <i class="material-icons" onclick="window.logout()">logout</i>
            </div>
        </header>

        <main>
            <div id="calendar-view-container" class="hidden">
                <div class="cal-header">
                    <i class="material-icons" style="cursor:pointer;" onclick="window.changeMonth(-1)">chevron_left</i>
                    <span id="cal-month-name">Mese Anno</span>
                    <i class="material-icons" style="cursor:pointer;" onclick="window.changeMonth(1)">chevron_right</i>
                </div>
                <div class="cal-grid" id="cal-grid-days"></div>
            </div>

            <!-- BARRA INPUT -->
            <div id="add-bar-container" class="add-bar hidden">
                <input type="date" id="date-input" class="hidden">
                <input type="time" id="time-input" class="hidden" style="width:100%;">
                
                <div id="recurrence-wrapper" class="hidden">
                    <select id="rec-unit" style="flex:2;" onchange="window.toggleRecurrenceInputs()">
                        <option value="none">Ripeti: No</option>
                        <option value="day">Giorni</option>
                        <option value="week">Settimane</option>
                        <option value="month">Mesi</option>
                        <option value="year">Anni</option>
                    </select>
                    <span class="rec-hidden-parts hidden rec-label">Ogni</span>
                    <input type="number" id="rec-interval" class="rec-hidden-parts hidden rec-input-small" value="1" min="1">
                    <span class="rec-hidden-parts hidden rec-label">Per</span>
                    <input type="number" id="rec-count" class="rec-hidden-parts hidden rec-input-small" value="1" min="1">
                    <span class="rec-hidden-parts hidden rec-label">volte</span>
                </div>

                <select id="category-select" class="hidden"></select>
                <select id="assign-who" class="hidden"></select>
                <input type="text" id="contact-detail-input" class="hidden" placeholder="Numero o Email">
                <input type="text" id="location-input" class="hidden" placeholder="📍 Luogo (es. Palestra, Via Roma 1)">

                <div class="input-text-group">
                    <input type="text" id="new-item-input" placeholder="Evento...">
                    <button id="add-btn"><i class="material-icons">add</i></button>
                </div>
            </div>

            <div id="note-editor-container" class="note-editor hidden">
                <h4 style="margin:0; color:#f9a825;">Nuova Nota</h4>
                <input type="text" id="note-title-input" placeholder="Titolo della nota">
                <textarea id="note-content-input" placeholder="Scrivi qui il contenuto..."></textarea>
                <button id="save-note-btn">SALVA NOTA</button>
                <input type="hidden" id="editing-note-id">
            </div>

            <!-- FILTER & BULK ACTIONS ROW -->
            <div class="filter-row hidden">
                <button id="bulk-toggle" class="bulk-toggle-btn" onclick="window.toggleBulkMode()"><i class="material-icons" style="font-size:18px;">checklist</i> Seleziona</button>
                <select id="filter-select" onchange="window.applyFilter()">
                    <option value="all">Mostra: Tutti</option>
                </select>
            </div>

            <!-- CONTENITORE LISTE -->
            <div id="list-container"></div>
            
            <!-- TASTO FLOTTANTE ELIMINA IN BLOCCO -->
            <button id="bulk-delete-btn" class="hidden" onclick="window.executeBulkDelete()"><i class="material-icons">delete</i> Elimina (<span id="bulk-count">0</span>)</button>

            <!-- IMPOSTAZIONI -->
            <div id="settings-view" class="hidden settings-view">
                <div id="super-admin-area" class="settings-section admin-panel hidden">
                    <h4 style="margin:0 0 10px 0; color:#e65100;">👑 Console Super Admin</h4>
                    <input type="email" id="admin-user-email" placeholder="Email Utente" style="margin-bottom:10px;">
                    <input type="text" id="admin-family-code" placeholder="Codice Famiglia (es. ROSSI)" style="margin-bottom:10px; text-transform:uppercase;">
                    <button onclick="window.adminAssociate()" style="background:#e65100; color:white; border:none; width:100%;">ASSOCIA ORA</button>
                    <p id="admin-status" style="font-size:0.8rem; margin-top:5px;"></p>
                </div>
                <div class="settings-section" style="border:1px solid var(--primary);">
                    <h4 style="margin:0 0 10px 0; color:var(--primary);">Account</h4>
                    <div class="settings-row" style="display:block;">
                        <div style="display:flex; gap:10px;">
                            <input type="password" id="new-password-input" placeholder="Nuova Password" style="margin:0; flex-grow:1;">
                            <button onclick="window.changeUserPassword()" style="background:var(--primary); color:white; border:none; width:auto; padding:0 15px; border-radius:8px;">Salva</button>
                        </div>
                    </div>
                </div>
                <div class="settings-section">
                    <h4 style="margin:0 0 10px 0;">Membri</h4>
                    <div id="members-list"></div>
                    <div style="display:flex; gap:10px; margin-top:10px;">
                        <input type="text" id="new-member-name" placeholder="Nuovo membro" style="margin:0; flex-grow:1;">
                        <button onclick="window.addMember()" style="background:var(--primary); color:white; border:none; width:40px; border-radius:8px;">+</button>
                    </div>
                </div>
                <div class="settings-section">
                    <h4 style="margin:0 0 10px 0;">Categorie</h4>
                    <div id="categories-list"></div>
                    <div style="display:flex; gap:10px; margin-top:10px;">
                        <input type="text" id="new-cat-name" placeholder="Categoria" style="margin:0; flex-grow:1;">
                        <input type="color" id="new-cat-color" value="#4285f4" style="width:40px; padding:0; height:40px; border:none; border-radius:50%; margin:0;">
                        <button onclick="window.addCategory()" style="background:var(--primary); color:white; border:none; width:40px; border-radius:8px;">+</button>
                    </div>
                </div>
            </div>
        </main>

        <nav class="bottom-nav">
            <button class="nav-item active" onclick="window.nav('dashboard')"><i class="material-icons">home</i> Home</button>
            <button class="nav-item" onclick="window.nav('calendar')"><i class="material-icons">event</i> Agenda</button>
            <button class="nav-item" onclick="window.nav('shopping')"><i class="material-icons">shopping_cart</i> Spesa</button>
            <button class="nav-item" onclick="window.nav('todos')"><i class="material-icons">check_circle</i> Compiti</button>
            <button class="nav-item" onclick="window.nav('chat')"><i class="material-icons">forum</i> Bacheca</button>
            <button class="nav-item" onclick="window.nav('contacts')"><i class="material-icons">contacts</i> Rubrica</button>
            <button class="nav-item" onclick="window.nav('notes')"><i class="material-icons">sticky_note_2</i> Note</button>
        </nav>
    </div>

    <!-- JS LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc, query, orderBy, serverTimestamp, getDoc, setDoc, getDocs, where } 
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, updatePassword, reauthenticateWithCredential, EmailAuthProvider, sendPasswordResetEmail } 
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCV51Ge3znsE6TPnQrJeEiNasz5YXtFWXk",
            authDomain: "drgfamilyhub.firebaseapp.com",
            projectId: "drgfamilyhub",
            storageBucket: "drgfamilyhub.firebasestorage.app",
            messagingSenderId: "709925755710",
            appId: "1:709925755710:web:6ebb2967fbc107447f6a6f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const SUPER_ADMIN_EMAIL = "antonioderosa@gmail.com";

        let currentSection = 'dashboard';
        let currentFamily = null;
        let unsubscribes = []; 
        let allDataCache = []; 
        let dashboardData = { calendar: [], chat: [], todos: [], shopping: [] };
        let familySettings = { members: ["Mamma", "Papà"], categories: [{name:"Casa", color:"#4285f4"}] };
        let currentDashboardUser = "";
        
        let isCalendarMode = false;
        let viewDate = new Date();
        let selectedDate = null;
        let isBulkMode = false;

        const authContainer = document.getElementById('auth-container');
        const appContainer = document.getElementById('app-container');
        const listContainer = document.getElementById('list-container');
        const settingsView = document.getElementById('settings-view');
        const addBarContainer = document.getElementById('add-bar-container');
        const noteEditorContainer = document.getElementById('note-editor-container');
        const loginStatus = document.getElementById('login-status');
        const calendarViewContainer = document.getElementById('calendar-view-container');
        const calendarToggleBtn = document.getElementById('calendar-toggle-btn');
        
        const categorySelect = document.getElementById('category-select');
        const assignWho = document.getElementById('assign-who');
        const filterSelect = document.getElementById('filter-select');
        const dateInput = document.getElementById('date-input');
        const timeInput = document.getElementById('time-input'); 
        const contactInput = document.getElementById('contact-detail-input');
        const locationInput = document.getElementById('location-input');
        const newItemInput = document.getElementById('new-item-input');
        const recUnit = document.getElementById('rec-unit');
        const recInterval = document.getElementById('rec-interval');
        const recCount = document.getElementById('rec-count');
        const recurrenceWrapper = document.getElementById('recurrence-wrapper');

        const noteTitleInput = document.getElementById('note-title-input');
        const noteContentInput = document.getElementById('note-content-input');
        const editingNoteId = document.getElementById('editing-note-id');

        window.toggleTheme = () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.getElementById('theme-toggle').innerText = isDark ? 'brightness_7' : 'brightness_4';
        };
        if(localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
            document.getElementById('theme-toggle').innerText = 'brightness_7';
        }

        // --- BULK MODE LOGIC ---
        window.toggleBulkMode = () => {
            isBulkMode = !isBulkMode;
            listContainer.classList.toggle('bulk-mode', isBulkMode);
            document.getElementById('bulk-delete-btn').classList.toggle('hidden', !isBulkMode);
            document.getElementById('bulk-toggle').classList.toggle('active', isBulkMode);
            
            if(!isBulkMode) { // Deseleziona tutti in uscita
                document.querySelectorAll('.bulk-checkbox').forEach(cb => cb.checked = false);
                window.updateBulkCount();
            }
        };
        window.updateBulkCount = () => {
            const count = document.querySelectorAll('.bulk-checkbox:checked').length;
            document.getElementById('bulk-count').innerText = count;
        };
        window.executeBulkDelete = async () => {
            const checks = document.querySelectorAll('.bulk-checkbox:checked');
            if(checks.length === 0) return;
            if(!confirm(`Sei sicuro di voler eliminare ${checks.length} elementi?`)) return;
            
            for(let c of checks) {
                await deleteDoc(doc(db, `${currentFamily}_${c.dataset.section}`, c.value));
            }
            window.toggleBulkMode(); 
        };

        document.getElementById('login-btn').addEventListener('click', () => {
            const email = document.getElementById('email-input').value;
            const pass = document.getElementById('password-input').value;
            if(!email || !pass) return;
            loginStatus.innerText = "Accesso...";
            signInWithEmailAndPassword(auth, email, pass).catch(e => loginStatus.innerText = "Errore: " + e.message);
        });

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                if (user.email === SUPER_ADMIN_EMAIL) document.getElementById('super-admin-area').classList.remove('hidden');
                try {
                    const userDoc = await getDoc(doc(db, "registro_utenti", user.email));
                    if (userDoc.exists()) {
                        currentFamily = userDoc.data().famiglia;
                        authContainer.classList.add('hidden');
                        appContainer.classList.remove('hidden');
                        document.getElementById('family-display').innerText = `Famiglia: ${currentFamily}`;
                        await loadSettings();
                        window.nav('dashboard'); 
                    } else { 
                        if (user.email === SUPER_ADMIN_EMAIL) { currentFamily = "ADMIN"; authContainer.classList.add('hidden'); appContainer.classList.remove('hidden'); window.nav('settings'); } 
                        else { alert("Utente non abilitato."); signOut(auth); }
                    }
                } catch (error) { loginStatus.innerText = "Errore connessione."; }
            } else { authContainer.classList.remove('hidden'); appContainer.classList.add('hidden'); }
        });

        window.logout = () => signOut(auth);
        
        window.toggleRecurrenceInputs = () => {
            const isRecurrent = recUnit.value !== 'none';
            document.querySelectorAll('.rec-hidden-parts').forEach(el => isRecurrent ? el.classList.remove('hidden') : el.classList.add('hidden'));
        };

        window.adminAssociate = async () => {
            const email = document.getElementById('admin-user-email').value.trim();
            const code = document.getElementById('admin-family-code').value.trim().toUpperCase();
            if(!email || !code) return;
            await setDoc(doc(db, "registro_utenti", email), { famiglia: code });
            document.getElementById('admin-status').innerText = `✅ Fatto: ${email}`;
        };

        async function loadSettings() {
            onSnapshot(doc(db, "settings", currentFamily), (docSnap) => {
                if (docSnap.exists()) familySettings = { ...familySettings, ...docSnap.data() };
                if (!currentDashboardUser && familySettings.members.length > 0) currentDashboardUser = familySettings.members[0];
                renderDropdowns(); renderSettingsView();
                if(currentSection === 'dashboard') renderDashboard();
            });
        }
        async function saveSettings() { await setDoc(doc(db, "settings", currentFamily), familySettings); }

        window.changeUserPassword = async () => {
            const newPass = document.getElementById('new-password-input').value;
            if(newPass.length < 6) return alert("Min 6 caratteri");
            try { await updatePassword(auth.currentUser, newPass); alert("Password aggiornata!"); }
            catch (e) { alert("Errore: riloggati e riprova."); }
        };

        function renderDropdowns() {
            categorySelect.innerHTML = "";
            familySettings.categories.forEach(cat => categorySelect.innerHTML += `<option value="${cat.name}">${cat.name}</option>`);
            filterSelect.innerHTML = `<option value="all">Mostra: Tutti</option>`;
            familySettings.categories.forEach(cat => filterSelect.innerHTML += `<option value="${cat.name}">Mostra: ${cat.name}</option>`);
            assignWho.innerHTML = `<option value="">Tag/Per: Nessuno</option>`;
            familySettings.members.forEach(mem => assignWho.innerHTML += `<option value="${mem}">${mem}</option>`);
        }

        window.nav = (section) => {
            if(isBulkMode) window.toggleBulkMode(); // Disattiva bulk mode se cambio tab
            currentSection = section;
            listContainer.innerHTML = '';
            
            settingsView.classList.add('hidden');
            addBarContainer.classList.add('hidden');
            noteEditorContainer.classList.add('hidden');
            calendarViewContainer.classList.add('hidden');
            calendarToggleBtn.classList.add('hidden');
            document.querySelector('.filter-row').classList.add('hidden');
            
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));

            if(section === 'chat' || section === 'contacts' || section === 'notes') document.querySelector('.filter-row').classList.add('hidden');
            
            dateInput.classList.add('hidden'); timeInput.classList.add('hidden'); recurrenceWrapper.classList.add('hidden');
            categorySelect.classList.add('hidden'); assignWho.classList.add('hidden'); contactInput.classList.add('hidden'); locationInput.classList.add('hidden');

            } else {
                addBarContainer.classList.remove('hidden'); 
                
                if(section === 'calendar') {
                    title.innerText = "Agenda"; calendarToggleBtn.classList.remove('hidden');

                    locationInput.classList.remove('hidden'); // Mostra campo luogo
                    newItemInput.placeholder = "Evento...";
                    if(isCalendarMode) calendarViewContainer.classList.remove('hidden'); 
                } 
                else if (section === 'todos') {
                    title.innerText = "Compiti"; dateInput.classList.remove('hidden'); 
                    categorySelect.classList.remove('hidden'); categorySelect.style.display = 'block'; 
                    assignWho.classList.remove('hidden'); assignWho.style.display = 'block'; newItemInput.placeholder = "Compito...";
                }
                else if (section === 'chat') {
                    title.innerText = "Bacheca"; assignWho.classList.remove('hidden'); assignWho.style.display = 'block'; newItemInput.placeholder = "Scrivi un messaggio...";
                }
                else if (section === 'contacts') {
                    title.innerText = "Rubrica"; contactInput.classList.remove('hidden'); newItemInput.placeholder = "Nome...";
                } else { title.innerText = "Spesa"; newItemInput.placeholder = "Cosa manca?"; }

            loadData(section);

        window.changeDashUser = (val) => { currentDashboardUser = val; renderDashboard(); };

        function loadDashboardData() {
            listContainer.innerHTML = '<div style="text-align:center; padding:30px; color:var(--text-sub);">Caricamento Home...</div>';
            clearSubscribes();
            const cols = ['calendar', 'chat', 'todos', 'shopping'];
            
            cols.forEach(col => {
                const unsub = onSnapshot(query(collection(db, `${currentFamily}_${col}`)), (snap) => {
                    dashboardData[col] = [];
                    snap.forEach(d => dashboardData[col].push({id: d.id, ...d.data()}));
                    if(currentSection === 'dashboard') renderDashboard();
                });
                unsubscribes.push(unsub);
            });
        }

        function renderDashboard() {
            if(currentSection !== 'dashboard') return;
            let userOpts = `<option value="">Vista: Tutta la Famiglia</option>`;
            familySettings.members.forEach(m => userOpts += `<option value="${m}" ${m===currentDashboardUser?'selected':''}>Vista: ${m}</option>`);

            let html = `<div style="background:var(--bg-card); padding:10px 15px; border-radius:12px; margin-bottom:15px; box-shadow:0 1px 3px var(--shadow);"><select onchange="window.changeDashUser(this.value)" style="width:100%; border:none; background:transparent; font-size:1rem; font-weight:bold; color:var(--primary); outline:none;">${userOpts}</select></div>`;

            const today = new Date().toISOString().split('T')[0];

            if(currentDashboardUser) {
                const chatForMe = dashboardData.chat.filter(c => c.tagged === currentDashboardUser).sort((a,b)=> b.timestamp - a.timestamp);
                if(chatForMe.length > 0) {
                    html += `<div class="dash-section-title"><i class="material-icons" style="color:#e65100">notifications_active</i> Avvisi in Bacheca</div>`;
                    chatForMe.forEach(c => html += renderHTMLCard(c, 'chat'));
                }
            }

            const impegni = dashboardData.calendar.filter(c => !c.done);
            const scaduti = impegni.filter(c => c.date && c.date < today);
            if(scaduti.length > 0) {
                html += `<div class="dash-section-title"><i class="material-icons" style="color:#d32f2f">warning</i> Impegni Scaduti</div>`;
                scaduti.forEach(c => html += renderHTMLCard(c, 'calendar'));
            }

            const futuri = impegni.filter(c => !c.date || c.date >= today).sort((a,b)=> (a.date||'9999') > (b.date||'9999') ? 1 : -1);
            if(futuri.length > 0) {
                html += `<div class="dash-section-title"><i class="material-icons" style="color:var(--primary)">event_upcoming</i> Prossimi Eventi</div>`;
                futuri.slice(0, 5).forEach(c => html += renderHTMLCard(c, 'calendar'));
            }

            const tasks = dashboardData.todos.filter(t => !t.done && (currentDashboardUser === "" || t.assigned === currentDashboardUser || !t.assigned)).sort((a,b)=> (a.date||'9999') > (b.date||'9999') ? 1 : -1);
            if(tasks.length > 0) {
                html += `<div class="dash-section-title"><i class="material-icons" style="color:#fbc02d">check_circle</i> Compiti</div>`;
                tasks.slice(0, 5).forEach(c => html += renderHTMLCard(c, 'todos'));
            }

            const shop = dashboardData.shopping.filter(s => !s.done && (currentDashboardUser === "" || s.assigned === currentDashboardUser || !s.assigned));
            if(shop.length > 0) {
                html += `<div class="dash-section-title"><i class="material-icons" style="color:#4caf50">shopping_cart</i> Spesa</div>`;
                shop.slice(0, 5).forEach(c => html += renderHTMLCard(c, 'shopping'));
            }

            if(html.indexOf('dash-section-title') === -1) html += `<div style="text-align:center; padding:40px 20px; color:var(--text-sub);">Tutto tranquillo! Non ci sono impegni in sospeso.</div>`;

            listContainer.innerHTML = html;
        }

        function clearSubscribes() { unsubscribes.forEach(u => u()); unsubscribes = []; }

        function loadData(section) {
            listContainer.innerHTML = '<div style="text-align:center; padding:30px; color:var(--text-sub);">Caricamento...</div>';
            clearSubscribes();
            if (!currentFamily) return;
            const col = `${currentFamily}_${section}`;
            
            let q = (section === 'calendar') ? query(collection(db, col), orderBy("date", "asc")) : query(collection(db, col), orderBy("timestamp", "desc"));
            
            const unsub = onSnapshot(q, (snap) => {
                allDataCache = []; snap.forEach(d => allDataCache.push({id:d.id, ...d.data()}));
                if(isCalendarMode && section === 'calendar') renderCalendarGrid();
                renderList();
            });
            unsubscribes.push(unsub);
        }

        window.applyFilter = () => renderList();

        function renderList() {
            listContainer.innerHTML = "";
            const filter = filterSelect.value;
            let filtered = allDataCache.filter(i => {
                const catMatch = filter === 'all' || i.category === filter;
                const dateMatch = !selectedDate || i.date === selectedDate || currentSection !== 'calendar';
                return catMatch && dateMatch;
            });
            
            if(filtered.length === 0) listContainer.innerHTML = "<div style='text-align:center;color:var(--text-sub);margin-top:40px'>Nessun elemento.</div>";
            let scrolled = false; const today = new Date().toISOString().split('T')[0];

            filtered.forEach(data => {
                if (currentSection === 'calendar' && !scrolled && data.date >= today && !selectedDate) {
                    const wrap = document.createElement('div'); wrap.id = "scroll-target"; 
                    wrap.innerHTML = renderHTMLCard(data, currentSection, (data.date === today));
                    listContainer.appendChild(wrap);
                    scrolled = true;
                } else {
                    const temp = document.createElement('div'); temp.innerHTML = renderHTMLCard(data, currentSection);
                    listContainer.appendChild(temp.firstChild);
                }
            });
            if(currentSection === 'calendar' && !selectedDate) {
                setTimeout(() => { const el = document.getElementById('scroll-target'); if(el) el.scrollIntoView({behavior: "smooth", block: "center"}); }, 300);
            }
        }

        function renderHTMLCard(data, sectionType, isToday = false) {
            const seriesIdSafe = data.seriesId ? `'${data.seriesId}'` : 'null';
            // CHECKBOX per BULK
            const checkboxHtml = `<input type="checkbox" class="bulk-checkbox" value="${data.id}" data-section="${sectionType}" onclick="window.updateBulkCount()">`;
            
            if (sectionType === 'notes') {
                return `<div class="card note-card" style="flex-direction:row;">${checkboxHtml}<div style="width:100%"><div class="note-title">${data.title||"Senza titolo"}</div><div class="note-body">${data.text}</div><div class="note-footer"><i class="material-icons" style="color:#fbc02d; cursor:pointer;" onclick="window.editNote('${data.id}')">edit</i><i class="material-icons" style="color:#ff5252; cursor:pointer;" onclick="window.del('${data.id}','${sectionType}', ${seriesIdSafe})">delete</i></div></div></div>`;
            }
            if (sectionType === 'chat') {
                const timeStr = data.timestamp ? data.timestamp.toDate().toLocaleString('it-IT', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'}) : '';
                const tagHtml = data.tagged ? `<div class="chat-tag">🔔 @${data.tagged}</div>` : '';
                return `<div class="card chat-card">${checkboxHtml}<div style="width:100%;"><div style="display:flex; justify-content:space-between; margin-bottom:5px;"><span class="chat-author">${data.author}</span> <span class="chat-time">${timeStr}</span></div><div style="font-size:1rem; white-space:pre-wrap;">${data.text}</div>${tagHtml}</div><i class="material-icons" style="color:#ff5252; cursor:pointer; align-self:center; margin-left:10px;" onclick="window.del('${data.id}','${sectionType}', ${seriesIdSafe})">delete</i></div>`;
            }

            const catObj = familySettings.categories.find(c => c.name === data.category);
            const color = catObj ? catObj.color : '#ccc';
            const assigned = data.assigned ? `<span class="assigned-badge">${data.assigned}</span>` : "";
            
            let content = "", actions = "";
            const strike = data.done ? 'text-decoration:line-through; color:var(--text-sub);' : '';
            const checkColor = data.done ? 'var(--primary)' : 'var(--border)';

            if (sectionType === 'calendar') {
                const d = data.date ? new Date(data.date) : new Date();
                const timeDisplay = data.time ? `<span class="time-display">${data.time}</span>` : "";
                const dStr = data.date || new Date().toISOString().split('T')[0];
                actions = `<i class="material-icons" style="color:var(--border); margin-left:10px; cursor:pointer;" onclick="window.exportGoogle('${data.text}','${dStr}')">event</i>`;
                
                // Mappa
                const locHtml = data.location ? `<br><a href="https://maps.google.com/?q=${encodeURIComponent(data.location)}" target="_blank" class="location-link"><i class="material-icons" style="font-size:14px; margin-right:4px;">place</i> ${data.location}</a>` : '';

                content = `<i class="material-icons" style="color:${checkColor}; margin-right:15px; cursor:pointer;" onclick="window.toggle('${data.id}',${!data.done},'${sectionType}')">${data.done ? 'check_circle' : 'radio_button_unchecked'}</i>
                           <div class="date-badge" style="${data.done?'opacity:0.5;':''}"><span class="date-day">${d.getDate()}</span><span class="date-month">${d.toLocaleString('it-IT',{month:'short'})}</span></div>
                           <div style="flex-grow:1; ${strike}"><div style="font-weight:600; font-size:1.1rem; margin-bottom:4px;">${timeDisplay}${data.text}</div>
                           <div style="font-size:0.8rem; color:var(--text-sub);"><span class="cat-dot" style="background:${color}"></span>${data.category||'Generale'} ${assigned}</div>${locHtml}</div>`;
            } 
            else if (sectionType === 'contacts') {
                content = `<div style="flex-grow:1"><div style="font-weight:600; font-size:1.1rem;">${data.text}</div><a href="tel:${data.detail}" style="color:var(--primary); text-decoration:none; display:flex; align-items:center; margin-top:5px;"><i class="material-icons" style="font-size:16px; margin-right:5px;">call</i>${data.detail}</a></div>`;
            } 
            else {
                let dateHtml = "";
                if(data.date && sectionType === 'todos') {
                    const dd = new Date(data.date); dateHtml = `<span class="due-date-display">Scadenza: ${dd.getDate()}/${dd.getMonth()+1}</span>`;
                }
                content = `<i class="material-icons" style="color:${checkColor}; margin-right:15px; cursor:pointer;" onclick="window.toggle('${data.id}',${!data.done},'${sectionType}')">${data.done ? 'check_circle' : 'radio_button_unchecked'}</i>
                           <div style="flex-grow:1; ${strike}"><span class="cat-dot" style="background:${color}"></span>${data.text} ${assigned} ${dateHtml}</div>`;
            }

            const todayCls = isToday ? 'today-card' : '';
            return `<div class="card ${todayCls}">${checkboxHtml}${content} <div style="display:flex; align-items:center;">${actions}<i class="material-icons" style="color:#ff5252; margin-left:15px; cursor:pointer;" onclick="window.del('${data.id}','${sectionType}', ${seriesIdSafe})">delete</i></div></div>`;
        }

        window.toggleCalendarView = () => {
            isCalendarMode = !isCalendarMode;
            if(isCalendarMode) { calendarViewContainer.classList.remove('hidden'); document.getElementById('calendar-toggle-btn').innerText = "view_list"; renderCalendarGrid(); } 
            else { calendarViewContainer.classList.add('hidden'); document.getElementById('calendar-toggle-btn').innerText = "calendar_month"; selectedDate = null; renderList(); }
        };
        window.changeMonth = (delta) => { viewDate.setMonth(viewDate.getMonth() + delta); renderCalendarGrid(); };

        function renderCalendarGrid() {
            const grid = document.getElementById('cal-grid-days'); const monthName = document.getElementById('cal-month-name'); grid.innerHTML = "";
            const days = ["L", "M", "M", "G", "V", "S", "D"]; days.forEach(d => grid.innerHTML += `<div class="cal-day-name">${d}</div>`);
            const year = viewDate.getFullYear(); const month = viewDate.getMonth();
            monthName.innerText = viewDate.toLocaleString('it-IT', { month: 'long', year: 'numeric' }).toUpperCase();
            const firstDay = new Date(year, month, 1).getDay(); const daysInMonth = new Date(year, month + 1, 0).getDate();
            const startOffset = firstDay === 0 ? 6 : firstDay - 1;
            for(let i=0; i<startOffset; i++) grid.innerHTML += `<div class="cal-day empty"></div>`;
            const todayStr = new Date().toISOString().split('T')[0];
            
            for(let i=1; i<=daysInMonth; i++) {
                const dStr = `${year}-${String(month+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
                const dayEvents = allDataCache.filter(ev => ev.date === dStr);
                const uniqueCategories = [...new Set(dayEvents.map(e => e.category))];
                let dotsHtml = `<div class="cal-dots-container">`;
                uniqueCategories.forEach(catName => { const catObj = familySettings.categories.find(c => c.name === catName); const color = catObj ? catObj.color : '#ccc'; dotsHtml += `<div class="cal-dot" style="background:${color}"></div>`; });
                dotsHtml += `</div>`;
                const isToday = dStr === todayStr ? 'today' : ''; const isSelected = selectedDate === dStr ? 'selected' : '';
                const div = document.createElement('div'); div.className = `cal-day ${isToday} ${isSelected}`; div.innerHTML = `<span>${i}</span>${dotsHtml}`;
                div.onclick = () => { selectedDate = dStr; renderCalendarGrid(); renderList(); };
                grid.appendChild(div);
            }
        }

        function renderSettingsView() {
            const memList = document.getElementById('members-list'); memList.innerHTML = "";
            familySettings.members.forEach((mem, i) => memList.innerHTML += `<div class="settings-row"><span>${mem}</span><i class="material-icons" style="color:red; cursor:pointer;" onclick="window.removeMember(${i})">delete</i></div>`);
            const catList = document.getElementById('categories-list'); catList.innerHTML = "";
            familySettings.categories.forEach((cat, i) => catList.innerHTML += `<div class="settings-row"><div style="display:flex;align-items:center"><span style="width:20px;height:20px;background:${cat.color};border-radius:50%;margin-right:10px;"></span>${cat.name}</div><i class="material-icons" style="color:red; cursor:pointer;" onclick="window.removeCategory(${i})">delete</i></div>`);
        }
        window.addMember = async () => { const n = document.getElementById('new-member-name').value; if(n){familySettings.members.push(n); await saveSettings(); document.getElementById('new-member-name').value="";}};
        window.removeMember = async (i) => { if(confirm("Eliminare?")){familySettings.members.splice(i,1); await saveSettings();}};
        window.addCategory = async () => { const n = document.getElementById('new-cat-name').value; const c=document.getElementById('new-cat-color').value; if(n){familySettings.categories.push({name:n, color:c}); await saveSettings(); document.getElementById('new-cat-name').value="";}};
        window.removeCategory = async (i) => { if(confirm("Eliminare?")){familySettings.categories.splice(i,1); await saveSettings();}};

        document.getElementById('add-btn').addEventListener('click', async () => {
            const txt = newItemInput.value; if(!txt) return;
            const cat = categorySelect.value; const who = assignWho.value; 
            let dVal = dateInput.value; const tVal = timeInput.value; 
            const locVal = locationInput.value;
            
            if(currentSection === 'chat') {
                const authorName = auth.currentUser.email.split('@')[0];
                await addDoc(collection(db, `${currentFamily}_chat`), { text: txt, timestamp: serverTimestamp(), author: authorName, tagged: who });
                newItemInput.value=""; assignWho.value=""; return;
            }

            let loops = 1;
            const rUnit = recUnit.value;
            const rInt = parseInt(recInterval.value) || 1;
            const rCount = parseInt(recCount.value) || 1;
            if(currentSection === 'calendar' && rUnit !== 'none') loops = rCount;
            
            const seriesId = (loops > 1) ? Date.now().toString(36) + Math.random().toString(36).substr(2, 5) : null;
            
            for(let i=0; i<loops; i++) {
                const item = { text: txt, timestamp: serverTimestamp(), done: false, category: cat, assigned: who };
                if (seriesId) item.seriesId = seriesId;

                if(currentSection === 'calendar') {
                    if(!dVal) return alert("Inserisci Data");
                    item.time = tVal;
                    if(locVal) item.location = locVal;

                    if (i > 0) {
                        const d = new Date(dVal);
                        if(rUnit === 'day') d.setDate(d.getDate() + (i * rInt));
                        if(rUnit === 'week') d.setDate(d.getDate() + (i * rInt * 7));
                        if(rUnit === 'month') d.setMonth(d.getMonth() + (i * rInt));
                        if(rUnit === 'year') d.setFullYear(d.getFullYear() + (i * rInt));
                        item.date = d.toISOString().split('T')[0];
                    } else { item.date = dVal; }
                } else if(currentSection === 'todos') { if(dVal) item.date = dVal; } 
                else if(currentSection === 'contacts') { item.detail = contactInput.value || ""; }
                
                await addDoc(collection(db, `${currentFamily}_${currentSection}`), item);
                if(currentSection !== 'calendar') break; 
            }
            newItemInput.value=""; contactInput.value=""; locationInput.value=""; recUnit.value="none"; window.toggleRecurrenceInputs();
        });

        document.getElementById('save-note-btn').addEventListener('click', async () => {
            const title = noteTitleInput.value; const content = noteContentInput.value; const editId = editingNoteId.value;
            if(!content) return alert("Scrivi qualcosa!");
            if (editId) { await updateDoc(doc(db, `${currentFamily}_notes`, editId), { title: title, text: content, timestamp: serverTimestamp() }); editingNoteId.value = ""; document.getElementById('save-note-btn').innerText = "SALVA NOTA"; } 
            else { await addDoc(collection(db, `${currentFamily}_notes`), { title: title, text: content, timestamp: serverTimestamp() }); }
            noteTitleInput.value = ""; noteContentInput.value = "";
        });

        // ELIMINA (Gestione Serie)
        window.del = async (id, section, seriesId) => {
            if(seriesId && seriesId !== 'null') {
                const ans = prompt("Questo evento fa parte di una serie ripetitiva.\n\nDigita 1 per eliminare SOLO QUESTO.\nDigita 2 per eliminare TUTTA LA SERIE.\n(Lascia vuoto per annullare)");
                if (ans === '1') {
                    await deleteDoc(doc(db, `${currentFamily}_${section}` , id));
                } else if (ans === '2') {
                    const q = query(collection(db, `${currentFamily}_${section}`), where("seriesId", "==", seriesId));
                    const snap = await getDocs(q);
                    snap.forEach(d => deleteDoc(d.ref));
                }
            } else {
                if(confirm("Eliminare definitivamente?")) await deleteDoc(doc(db, `${currentFamily}_${section}` , id));
            }
        };

        window.toggle = async (id, st, section) => { await updateDoc(doc(db, `${currentFamily}_${section}`, id), {done:st}); };
        window.editNote = (id) => { const note = allDataCache.find(n => n.id === id); if (note) { noteTitleInput.value = note.title || ""; noteContentInput.value = note.text || ""; editingNoteId.value = id; document.getElementById('save-note-btn').innerText = "AGGIORNA NOTA"; window.scrollTo({ top: 0, behavior: 'smooth' });}};
        window.exportGoogle = (t,d) => { const x=d.replace(/-/g,''); window.open(`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(t)}&dates=${x}/${x}`,'_blank');};

    </script>
    
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js'); });
        }
    </script>
</body>
</html>
