<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Family Hub</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Family Hub">
    <link rel="apple-touch-icon" href="icon.png">
    
    <!-- FONT: Playfair Display (Serif Elegante) & Inter (Pulito per testi) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    
    <!-- ICONE: Material Symbols Outlined (Leggere e minimali, wght=300) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    
    <style>
        :root {
            /* TEMA SALVIA / SCANDINAVO MINIMAL */
            --bg-body: #F7F7F6;      /* Panna/Grigio molto chiaro */
            --bg-card: #FFFFFF;
            --text-main: #2C3531;    /* Grigio/Verde molto scuro */
            --text-sub: #7D847F;     /* Grigio medio desaturato */
            --border: #E8EBE9;       /* Bordi leggerissimi */
            
            --primary: #859B8B;      /* Verde Salvia Elegante */
            --primary-hover: #728777;
            --accent-bg: #F0F4F1;    /* Sfondo tenue Salvia */
            
            --nav-bg: #FFFFFF;
            --shadow: rgba(0,0,0,0.03); /* Ombre impalpabili */
            --input-bg: #FAFAFA;
            
            --alert: #C78283;        /* Rosso tenue / Terracotta */
            --warning: #D1A77E;      /* Senape tenue */
        }

        body.dark-mode {
            /* TEMA SCURO (Mantiene accenti salvia desaturati) */
            --bg-body: #1E201E;
            --bg-card: #282A29;
            --text-main: #EAEBEA;
            --text-sub: #9FA4A1;
            --border: #3A3D3C;
            
            --primary: #94A899;
            --primary-hover: #AEC2B3;
            --accent-bg: #323835;
            
            --nav-bg: #1E201E;
            --shadow: rgba(0,0,0,0.2);
            --input-bg: #323533;
            
            --alert: #D69798;
            --warning: #E0BA98;
        }

        /* STILI FONT GLOBALI */
        body { 
            background-color: var(--bg-body); color: var(--text-main); 
            font-family: 'Inter', sans-serif; /* Default body text */
            -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; transition: background 0.3s; 
        }
        * { box-sizing: border-box; } 

        h1, h2, h3, h4, .dash-section-title, .note-title {
            font-family: 'Playfair Display', serif;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        /* REGOLE PER LE ICONE MINIMALI */
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }

        /* HEADER */
        header { 
            background: var(--bg-card); padding: 18px 25px; position: sticky; top: 0; z-index: 100; 
            box-shadow: 0 1px 8px var(--shadow); display: flex; justify-content: space-between; align-items: center; 
            color: var(--text-main); border-bottom: 1px solid var(--border);
        }
        .header-controls { display: flex; align-items: center; gap: 18px; }
        .header-controls i { color: var(--text-sub); cursor: pointer; transition: color 0.2s; }
        .header-controls i:hover { color: var(--primary); }
        
        .filter-row { padding: 0 20px; display: flex; justify-content: space-between; align-items: center; margin: 15px 0 5px 0; }
        .filter-row select { font-family: 'Inter', sans-serif; width: auto !important; height: 35px !important; font-size: 0.85rem; border: none; background-color: transparent; color: var(--text-sub); font-weight: 500; padding-right: 25px; cursor: pointer; }

        /* VISTA CALENDARIO E TOGGLE */
        .agenda-view-toggle { display: flex; background: var(--bg-card); border-radius: 12px; margin: 20px; border: 1px solid var(--border); overflow: hidden; }
        .agenda-view-toggle button { font-family: 'Inter', sans-serif; flex: 1; padding: 12px; border: none; background: transparent; color: var(--text-sub); font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.9rem; transition: 0.3s; }
        .agenda-view-toggle button.active { background: var(--primary); color: white; }

        #calendar-view-container { background: var(--bg-card); margin: 20px; border-radius: 16px; padding: 20px; border: 1px solid var(--border); }
        .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-family: 'Playfair Display', serif; font-size: 1.2rem; color: var(--text-main); }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; text-align: center; }
        .cal-day-name { font-size: 0.75rem; color: var(--text-sub); margin-bottom: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        .cal-day { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 50%; font-size: 0.95rem; cursor: pointer; position: relative; color: var(--text-main); transition: 0.2s; }
        .cal-day:hover:not(.empty) { background-color: var(--accent-bg); }
        .cal-day.selected { background-color: var(--primary); color: white !important; font-weight: bold; }
        .cal-day.today { border: 1px solid var(--primary); }
        .cal-day.empty { pointer-events: none; }
        .cal-dots-container { display: flex; gap: 3px; margin-top: 4px; justify-content: center; flex-wrap: wrap; max-width: 80%; }
        .cal-dot { width: 4px; height: 4px; border-radius: 50%; } 
        
        /* BARRA INSERIMENTO */
        .add-bar { background: var(--bg-card); padding: 20px; margin: 20px; border-radius: 16px; border: 1px solid var(--border); display: grid; grid-template-columns: 1fr 1fr; gap: 15px; align-items: start; }
        .add-bar select, .add-bar input, #add-btn, .note-editor input, .note-editor button, .admin-panel input, .admin-panel button { font-family: 'Inter', sans-serif; height: 50px !important; width: 100%; border: 1px solid var(--border); border-radius: 12px; background-color: var(--input-bg); font-size: 15px; padding: 0 16px; color: var(--text-main); margin: 0; appearance: none; -webkit-appearance: none; outline: none; transition: border-color 0.2s; }
        .add-bar input:focus, .add-bar select:focus { border-color: var(--primary); }

        #recurrence-wrapper { grid-column: 1 / -1; background: var(--accent-bg); border-radius: 12px; padding: 15px 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border: none; }
        .rec-input-small { flex: 1; min-width: 60px; text-align: center; }
        .rec-label { font-size: 0.8rem; color: var(--text-sub); white-space: nowrap; font-weight: 500; }

        .add-bar select { background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23859B8B%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E"); background-repeat: no-repeat; background-position: right 16px top 50%; background-size: 10px auto; }
        
        .assign-chips { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 5px; }
        .chip { padding: 8px 16px; border-radius: 20px; background: var(--bg-card); border: 1px solid var(--border); color: var(--text-sub); font-size: 0.85rem; cursor: pointer; font-weight: 500; transition: 0.2s; user-select: none; }
        .chip.active { background: var(--primary); border-color: var(--primary); color: white; }
        .day-chip { padding: 8px 14px; }
        
        .input-text-group { grid-column: 1 / -1; display: flex; gap: 12px; align-items: stretch; }
        #new-item-input { flex-grow: 1; border: 1px solid var(--border); }
        #new-item-input:focus { border-color: var(--primary); }
        #contact-detail-input, #location-input { grid-column: 1 / -1; }
        
        #add-btn { width: 50px !important; padding: 0; background: var(--primary); color: white; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; border-radius: 12px; }
        #add-btn:hover { background: var(--primary-hover); }
        #add-btn.edit-mode { background: var(--warning); color: #fff; }

        .note-editor { background: var(--bg-card); padding: 20px; margin: 20px; border-radius: 16px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 15px; }
        .note-editor textarea { font-family: 'Inter', sans-serif; width: 100%; height: 180px; border: 1px solid var(--border); border-radius: 12px; background-color: var(--input-bg); font-size: 15px; padding: 16px; color: var(--text-main); resize: none; outline: none; }
        #save-note-btn { background: var(--primary); color: white; font-weight: 500; border: none; cursor: pointer; letter-spacing: 0.5px; }

        .hidden { display: none !important; }

        /* LISTE E CARDS CON LAYOUT RESPONSIVE (MASONRY-STYLE GRID) */
        #list-container { 
            padding: 0 20px 120px 20px; 
            /* Grid per schermi larghi */
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            align-content: start;
        } 
        
        /* Media Query per Tablet/PC */
        @media (min-width: 768px) {
            #list-container {
                grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
                align-items: start;
            }
            .dash-section-title {
                grid-column: 1 / -1; /* Il titolo occupa tutta la larghezza */
                margin-top: 30px;
            }
            .status-container {
                grid-column: 1 / -1;
            }
            .dash-header-select {
                grid-column: 1 / -1;
            }
        }

        .card { background: var(--bg-card); padding: 18px; border-radius: 16px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
        .card:hover { border-color: var(--primary); }
        
        .note-card { flex-direction: column; align-items: flex-start; gap: 12px; }
        .note-title { font-size: 1.15rem; color: var(--text-main); width: 100%; margin: 0; }
        .note-body { white-space: pre-wrap; color: var(--text-sub); font-size: 0.9rem; line-height: 1.5; width: 100%; }
        
        .chat-card { flex-direction: row; align-items: flex-start; gap: 12px; }
        .chat-author { font-weight: 600; color: var(--primary); font-size: 0.85rem; text-transform: capitalize; }
        .chat-time { font-size: 0.75rem; color: var(--text-sub); margin-left: auto; }
        .chat-tag { background: var(--accent-bg); color: var(--primary); padding: 4px 10px; border-radius: 8px; font-size: 0.75rem; display: inline-block; margin-top: 10px; font-weight: 600; letter-spacing: 0.5px; }
        
        .date-badge { background: var(--accent-bg); color: var(--primary); padding: 8px 12px; border-radius: 12px; text-align: center; margin-right: 15px; min-width: 55px; display: flex; flex-direction: column; justify-content: center; }
        .date-day { font-size: 1.3rem; font-weight: bold; line-height: 1; font-family: 'Playfair Display', serif; }
        .date-month { font-size: 0.65rem; text-transform: uppercase; margin-top: 4px; font-weight: 600; letter-spacing: 1px; }
        .today-card { border-left: 4px solid var(--primary); }
        
        .time-display { font-size: 0.75rem; background: var(--input-bg); padding: 3px 8px; border-radius: 6px; margin-right: 8px; color: var(--text-main); font-weight: 500; border: 1px solid var(--border); }
        .due-date-display { font-size: 0.75rem; color: var(--alert); font-weight: 500; display: block; margin-top: 4px; }
        .location-link { display: inline-flex; align-items: center; color: var(--text-sub); text-decoration: none; font-size: 0.8rem; margin-top: 8px; transition: color 0.2s; }
        .location-link:hover { color: var(--primary); }
        
        .cat-dot { height: 8px; width: 8px; border-radius: 50%; display: inline-block; margin-right: 8px; vertical-align: middle; }
        .assigned-badge { font-size: 0.7rem; color: var(--text-sub); padding: 2px 0; margin-left: 8px; display: inline-block; vertical-align: middle; font-weight: 500; }
        
        /* BULK DELETE */
        .bulk-checkbox { display: none; width: 20px; height: 20px; margin-right: 15px; accent-color: var(--alert); flex-shrink:0; cursor:pointer;}
        #list-container.bulk-mode .bulk-checkbox { display: block; }
        #bulk-delete-btn { position: fixed; bottom: 95px; left: 50%; transform: translateX(-50%); background: var(--alert); color: white; border: none; padding: 14px 28px; border-radius: 30px; font-weight: 600; font-family: 'Inter', sans-serif; z-index: 300; display:flex; align-items:center; gap:8px; cursor: pointer; transition: 0.2s; }
        #bulk-delete-btn:hover { background: #b06e6f; }
        .bulk-toggle-btn { display:flex; align-items:center; gap:6px; color:var(--text-sub); font-size:0.85rem; font-family: 'Inter', sans-serif; background:none; border:1px solid var(--border); padding:6px 12px; border-radius:20px; cursor:pointer; font-weight: 500; transition: 0.2s;}
        .bulk-toggle-btn.active { background: var(--alert); color: white; border-color: var(--alert); }

        /* NAVIGAZIONE SCORREVOLE (Minimal Icon Style) */
        .bottom-nav { 
            position: fixed; bottom: 0; width: 100%; background: var(--nav-bg); border-top: 1px solid var(--border); 
            display: flex; justify-content: flex-start; gap: 8px; padding: 12px 20px 25px 20px; z-index: 200; 
            overflow-x: auto; -webkit-overflow-scrolling: touch; 
        }
        .bottom-nav::-webkit-scrollbar { display: none; }
        .nav-item { font-family: 'Inter', sans-serif; background: none; border: none; color: var(--text-sub); display: flex; flex-direction: column; align-items: center; font-size: 0.65rem; padding: 6px 12px; min-width: 65px; flex-shrink: 0; cursor: pointer; border-radius: 12px; transition: 0.2s; font-weight: 500; }
        .nav-item.active { color: var(--primary); background: var(--accent-bg); }
        .nav-item i { font-size: 24px; margin-bottom: 4px; }
        
        /* DASHBOARD */
        .dash-section-title { font-size: 1.1rem; color: var(--text-main); margin: 20px 0 5px 0; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .dash-header-select { background: var(--bg-card); padding: 15px 20px; border-radius: 16px; margin-bottom: 10px; border: 1px solid var(--border); }
        .dash-header-select select { font-family: 'Inter', sans-serif; width: 100%; border: none; background: transparent; font-size: 1rem; font-weight: 600; color: var(--primary); outline: none; cursor: pointer;}
        
        /* CHI È A CASA */
        .status-container { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
        .status-chip { padding: 10px 18px; border-radius: 25px; font-size: 0.9rem; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); transition: 0.2s; user-select: none; background-color: var(--bg-card); color: var(--text-sub); }
        .status-chip.is-home { border-color: var(--primary); color: var(--primary); background-color: var(--accent-bg); }
        
        /* IMPOSTAZIONI */
        .settings-view { padding: 20px; padding-bottom: 100px; }
        .settings-section { background: var(--bg-card); border-radius: 16px; padding: 20px; margin-bottom: 20px; border: 1px solid var(--border); }
        .settings-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); color: var(--text-main); font-size: 0.95rem; }
        .admin-panel { border: 1px solid var(--warning); background: transparent; }
        
        #auth-container { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 30px; background: var(--bg-body); }
        #auth-container h1 { font-family: 'Playfair Display', serif; color: var(--primary); font-size: 3rem; margin-bottom: 10px; }
        #auth-container input { width: 100%; max-width: 320px; height: 55px; margin-bottom: 15px; border: 1px solid var(--border); border-radius: 12px; padding: 0 20px; font-size: 16px; font-family: 'Inter', sans-serif; }
        #login-btn { width: 100%; max-width: 320px; height: 55px; background: var(--primary); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; font-family: 'Inter', sans-serif; cursor: pointer; }
    </style>
</head>
<body>

    <div id="auth-container">
        <h1>Family Hub</h1>
        <p style="color:var(--text-sub); margin-bottom: 40px;">Il centro della tua casa.</p>
        <input type="email" id="email-input" placeholder="Email">
        <input type="password" id="password-input" placeholder="Password">
        <button id="login-btn">Entra</button>
        <p onclick="window.resetPassword()" style="color:var(--primary); cursor:pointer; margin-top:20px; font-size: 0.9rem;">Password dimenticata?</p>
        <p id="login-status" style="margin-top: 20px; color: var(--alert); font-size: 0.9rem;"></p>
    </div>

    <div id="app-container" class="hidden">
        <header>
            <div>
                <h2 id="page-title" style="margin:0; font-size: 1.4rem;">Home</h2>
                <span id="family-display" style="font-size:0.75rem; font-weight: 500; color: var(--text-sub);">Caricamento...</span>
            </div>
            <div class="header-controls">
                <i id="theme-toggle" class="material-symbols-outlined" onclick="window.toggleTheme()">dark_mode</i>
                <i class="material-symbols-outlined" onclick="window.nav('settings')">settings</i>
                <i class="material-symbols-outlined" onclick="window.logout()">logout</i>
            </div>
        </header>

        <main>
            <div id="agenda-view-toggle" class="agenda-view-toggle hidden">
                <button id="btn-view-list" class="active" onclick="window.setAgendaView('list')"><span class="material-symbols-outlined">view_agenda</span> Lista</button>
                <button id="btn-view-cal" onclick="window.setAgendaView('calendar')"><span class="material-symbols-outlined">calendar_month</span> Mese</button>
            </div>

            <div id="calendar-view-container" class="hidden">
                <div class="cal-header">
                    <i class="material-symbols-outlined" style="cursor:pointer;" onclick="window.changeMonth(-1)">chevron_left</i>
                    <span id="cal-month-name">Mese Anno</span>
                    <i class="material-symbols-outlined" style="cursor:pointer;" onclick="window.changeMonth(1)">chevron_right</i>
                </div>
                <div class="cal-grid" id="cal-grid-days"></div>
            </div>

            <div id="add-bar-container" class="add-bar hidden">
                <input type="date" id="date-input" class="hidden">
                <input type="time" id="time-input" class="hidden" style="width:100%;">
                
                <div id="recurrence-wrapper" class="hidden">
                    <select id="rec-unit" style="flex:2; min-width:110px;" onchange="window.toggleRecurrenceInputs()">
                        <option value="none">Ripeti: No</option>
                        <option value="day">Giorni</option>
                        <option value="week">Settimane</option>
                        <option value="month">Mesi</option>
                        <option value="year">Anni</option>
                    </select>
                    <span class="rec-hidden-parts hidden rec-label">Ogni</span>
                    <input type="number" id="rec-interval" class="rec-hidden-parts hidden rec-input-small" value="1" min="1">
                    <span class="rec-hidden-parts hidden rec-label">Per</span>
                    <input type="number" id="rec-count" class="rec-hidden-parts hidden rec-input-small" value="1" min="1">
                    <span class="rec-hidden-parts hidden rec-label">volte</span>
                    
                    <div id="week-days-selector" class="hidden assign-chips" style="width:100%; justify-content:center; margin-top:8px;">
                        <div class="chip day-chip" data-day="1" onclick="this.classList.toggle('active')">L</div>
                        <div class="chip day-chip" data-day="2" onclick="this.classList.toggle('active')">M</div>
                        <div class="chip day-chip" data-day="3" onclick="this.classList.toggle('active')">M</div>
                        <div class="chip day-chip" data-day="4" onclick="this.classList.toggle('active')">G</div>
                        <div class="chip day-chip" data-day="5" onclick="this.classList.toggle('active')">V</div>
                        <div class="chip day-chip" data-day="6" onclick="this.classList.toggle('active')">S</div>
                        <div class="chip day-chip" data-day="0" onclick="this.classList.toggle('active')">D</div>
                    </div>
                </div>

                <select id="category-select" class="hidden"></select>
                
                <div id="assign-who-container" class="hidden assign-chips"></div>
                
                <input type="text" id="contact-detail-input" class="hidden" placeholder="Info contatto...">
                <input type="text" id="location-input" class="hidden" placeholder="Indirizzo o Luogo...">

                <div class="input-text-group">
                    <input type="text" id="new-item-input" placeholder="Aggiungi...">
                    <button id="add-btn"><span class="material-symbols-outlined">add</span></button>
                </div>
            </div>

            <div id="note-editor-container" class="note-editor hidden">
                <input type="text" id="note-title-input" placeholder="Titolo (es. Ricetta Torta, Wi-Fi)" style="font-weight: 600;">
                <textarea id="note-content-input" placeholder="Scrivi qui il contenuto..."></textarea>
                <button id="save-note-btn">Salva Nota</button>
                <input type="hidden" id="editing-note-id">
            </div>

            <div class="filter-row hidden">
                <button id="bulk-toggle" class="bulk-toggle-btn" onclick="window.toggleBulkMode()"><span class="material-symbols-outlined" style="font-size:18px;">checklist</span> Seleziona</button>
                <select id="filter-select" onchange="window.applyFilter()">
                    <option value="all">Mostra: Tutti</option>
                </select>
            </div>

            <div id="list-container"></div>
            
            <button id="bulk-delete-btn" class="hidden" onclick="window.executeBulkDelete()"><span class="material-symbols-outlined">delete</span> Elimina (<span id="bulk-count">0</span>)</button>

            <!-- IMPOSTAZIONI (Restyling) -->
            <div id="settings-view" class="hidden settings-view">
                <div id="super-admin-area" class="settings-section admin-panel hidden">
                    <h4 style="margin:0 0 15px 0; color:var(--warning);">Console Super Admin</h4>
                    <input type="email" id="admin-user-email" placeholder="Email Utente" style="margin-bottom:10px;">
                    <input type="text" id="admin-family-code" placeholder="Codice Famiglia (es. ROSSI)" style="margin-bottom:10px; text-transform:uppercase;">
                    <button onclick="window.adminAssociate()" style="background:var(--warning); color:white; border:none; width:100%; height:45px; border-radius:12px; font-weight:bold; cursor:pointer;">Associa Ora</button>
                    <p id="admin-status" style="font-size:0.8rem; margin-top:10px;"></p>
                </div>
                
                <div class="settings-section">
                    <h4 style="margin:0 0 15px 0; color:var(--text-main);">Sicurezza Account</h4>
                    <div style="display:flex; gap:10px;">
                        <input type="password" id="new-password-input" placeholder="Nuova Password" style="flex-grow:1; height:45px; border:1px solid var(--border); border-radius:12px; padding:0 15px;">
                        <button onclick="window.changeUserPassword()" style="background:var(--primary); color:white; border:none; padding:0 20px; border-radius:12px; cursor:pointer; font-weight:500;">Salva</button>
                    </div>
                </div>
                
                <div class="settings-section">
                    <h4 style="margin:0 0 15px 0;">Membri della Famiglia</h4>
                    <div id="members-list"></div>
                    <div style="display:flex; gap:10px; margin-top:15px;">
                        <input type="text" id="new-member-name" placeholder="Aggiungi nome..." style="flex-grow:1; height:45px; border:1px solid var(--border); border-radius:12px; padding:0 15px;">
                        <button onclick="window.addMember()" style="background:var(--primary); color:white; border:none; width:45px; border-radius:12px; cursor:pointer;"><span class="material-symbols-outlined">add</span></button>
                    </div>
                </div>
                
                <div class="settings-section">
                    <h4 style="margin:0 0 15px 0;">Categorie</h4>
                    <div id="categories-list"></div>
                    <div style="display:flex; gap:10px; margin-top:15px;">
                        <input type="text" id="new-cat-name" placeholder="Nuova categoria..." style="flex-grow:1; height:45px; border:1px solid var(--border); border-radius:12px; padding:0 15px;">
                        <input type="color" id="new-cat-color" value="#859B8B" style="width:45px; padding:0; height:45px; border:none; border-radius:12px; cursor:pointer;">
                        <button onclick="window.addCategory()" style="background:var(--primary); color:white; border:none; width:45px; border-radius:12px; cursor:pointer;"><span class="material-symbols-outlined">add</span></button>
                    </div>
                </div>
            </div>
        </main>

        <nav class="bottom-nav">
            <button class="nav-item active" onclick="window.nav('dashboard')"><span class="material-symbols-outlined">home</span> Home</button>
            <button class="nav-item" onclick="window.nav('chat')"><span class="material-symbols-outlined">chat_bubble</span> Messaggi</button>
            <button class="nav-item" onclick="window.nav('todos')"><span class="material-symbols-outlined">task_alt</span> Compiti</button>
            <button class="nav-item" onclick="window.nav('shopping')"><span class="material-symbols-outlined">shopping_basket</span> Spesa</button>
            <button class="nav-item" onclick="window.nav('calendar')"><span class="material-symbols-outlined">event_note</span> Agenda</button>
            <button class="nav-item" onclick="window.nav('contacts')"><span class="material-symbols-outlined">contacts</span> Rubrica</button>
            <button class="nav-item" onclick="window.nav('notes')"><span class="material-symbols-outlined">description</span> Note</button>
        </nav>
    </div>

    <!-- JS LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc, query, orderBy, serverTimestamp, getDoc, setDoc, getDocs, where } 
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, updatePassword, sendPasswordResetEmail } 
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCV51Ge3znsE6TPnQrJeEiNasz5YXtFWXk",
            authDomain: "drgfamilyhub.firebaseapp.com",
            projectId: "drgfamilyhub",
            storageBucket: "drgfamilyhub.firebasestorage.app",
            messagingSenderId: "709925755710",
            appId: "1:709925755710:web:6ebb2967fbc107447f6a6f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const SUPER_ADMIN_EMAIL = "antonioderosa@gmail.com";

        let currentSection = 'dashboard';
        let currentFamily = null;
        let unsubscribes = []; 
        let allDataCache = []; 
        let dashboardData = { calendar: [], chat: [], todos: [], shopping: [] };
        let familySettings = { members: ["Mamma", "Papà"], categories: [{name:"Generale", color:"#859B8B"}], status: {} };
        let currentDashboardUser = "";
        
        let isCalendarMode = false;
        let viewDate = new Date();
        let selectedDate = null;
        let isBulkMode = false;
        let editingItem = null;
        let editingItemSection = null;

        const authContainer = document.getElementById('auth-container');
        const appContainer = document.getElementById('app-container');
        const listContainer = document.getElementById('list-container');
        const settingsView = document.getElementById('settings-view');
        const addBarContainer = document.getElementById('add-bar-container');
        const noteEditorContainer = document.getElementById('note-editor-container');
        const loginStatus = document.getElementById('login-status');
        const calendarViewContainer = document.getElementById('calendar-view-container');
        const agendaViewToggle = document.getElementById('agenda-view-toggle');
        
        const categorySelect = document.getElementById('category-select');
        const filterSelect = document.getElementById('filter-select');
        const dateInput = document.getElementById('date-input');
        const timeInput = document.getElementById('time-input'); 
        const contactInput = document.getElementById('contact-detail-input');
        const locationInput = document.getElementById('location-input');
        const newItemInput = document.getElementById('new-item-input');
        const recUnit = document.getElementById('rec-unit');
        const recInterval = document.getElementById('rec-interval');
        const recCount = document.getElementById('rec-count');
        const recurrenceWrapper = document.getElementById('recurrence-wrapper');

        const noteTitleInput = document.getElementById('note-title-input');
        const noteContentInput = document.getElementById('note-content-input');
        const editingNoteId = document.getElementById('editing-note-id');

        window.toggleTheme = () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.getElementById('theme-toggle').innerText = isDark ? 'light_mode' : 'dark_mode';
        };
        if(localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
            document.getElementById('theme-toggle').innerText = 'light_mode';
        } else {
            document.getElementById('theme-toggle').innerText = 'dark_mode';
        }

        window.toggleBulkMode = () => {
            isBulkMode = !isBulkMode;
            listContainer.classList.toggle('bulk-mode', isBulkMode);
            document.getElementById('bulk-delete-btn').classList.toggle('hidden', !isBulkMode);
            document.getElementById('bulk-toggle').classList.toggle('active', isBulkMode);
            
            if(!isBulkMode) { 
                document.querySelectorAll('.bulk-checkbox').forEach(cb => cb.checked = false);
                window.updateBulkCount();
            }
        };
        window.updateBulkCount = () => {
            const count = document.querySelectorAll('.bulk-checkbox:checked').length;
            document.getElementById('bulk-count').innerText = count;
        };
        window.executeBulkDelete = async () => {
            const checks = document.querySelectorAll('.bulk-checkbox:checked');
            if(checks.length === 0) return;
            if(!confirm(`Sei sicuro di voler eliminare ${checks.length} elementi?`)) return;
            
            for(let c of checks) { await deleteDoc(doc(db, `${currentFamily}_${c.dataset.section}`, c.value)); }
            window.toggleBulkMode(); 
        };

        document.getElementById('login-btn').addEventListener('click', () => {
            const email = document.getElementById('email-input').value;
            const pass = document.getElementById('password-input').value;
            if(!email || !pass) return;
            loginStatus.innerText = "Accesso in corso...";
            signInWithEmailAndPassword(auth, email, pass).catch(e => loginStatus.innerText = "Errore credenziali");
        });

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                if (user.email === SUPER_ADMIN_EMAIL) document.getElementById('super-admin-area').classList.remove('hidden');
                try {
                    const userDoc = await getDoc(doc(db, "registro_utenti", user.email));
                    if (userDoc.exists()) {
                        currentFamily = userDoc.data().famiglia;
                        authContainer.classList.add('hidden');
                        appContainer.classList.remove('hidden');
                        document.getElementById('family-display').innerText = `Famiglia: ${currentFamily}`;
                        await loadSettings();
                        window.nav('dashboard'); 
                    } else { 
                        if (user.email === SUPER_ADMIN_EMAIL) { currentFamily = "ADMIN"; authContainer.classList.add('hidden'); appContainer.classList.remove('hidden'); window.nav('settings'); } 
                        else { alert("Utente non abilitato."); signOut(auth); }
                    }
                } catch (error) { loginStatus.innerText = "Errore connessione."; }
            } else { authContainer.classList.remove('hidden'); appContainer.classList.add('hidden'); }
        });

        window.logout = () => signOut(auth);
        
        window.toggleRecurrenceInputs = () => {
            const isRecurrent = recUnit.value !== 'none';
            document.querySelectorAll('.rec-hidden-parts').forEach(el => isRecurrent ? el.classList.remove('hidden') : el.classList.add('hidden'));
            if(recUnit.value === 'week') document.getElementById('week-days-selector').classList.remove('hidden');
            else document.getElementById('week-days-selector').classList.add('hidden');
        };

        window.adminAssociate = async () => {
            const email = document.getElementById('admin-user-email').value.trim();
            const code = document.getElementById('admin-family-code').value.trim().toUpperCase();
            if(!email || !code) return;
            await setDoc(doc(db, "registro_utenti", email), { famiglia: code });
            document.getElementById('admin-status').innerText = `✅ Assegnato: ${email}`;
        };

        async function loadSettings() {
            onSnapshot(doc(db, "settings", currentFamily), (docSnap) => {
                if (docSnap.exists()) {
                    familySettings = { ...familySettings, ...docSnap.data() };
                    if(!familySettings.status) familySettings.status = {};
                }
                if (!currentDashboardUser && familySettings.members.length > 0) currentDashboardUser = familySettings.members[0];
                renderDropdowns(); renderSettingsView();
                if(currentSection === 'dashboard') renderDashboard();
            });
        }
        async function saveSettings() { await setDoc(doc(db, "settings", currentFamily), familySettings, {merge: true}); }

        window.changeUserPassword = async () => {
            const newPass = document.getElementById('new-password-input').value;
            if(newPass.length < 6) return alert("Minimo 6 caratteri");
            try { await updatePassword(auth.currentUser, newPass); alert("Password aggiornata con successo."); }
            catch (e) { alert("Errore di sicurezza: esci, rientra e riprova."); }
        };

        window.toggleStatus = async (mem) => {
            const current = familySettings.status[mem] || 'out';
            const nextStatus = current === 'home' ? 'out' : 'home';
            const newStatusObj = { ...familySettings.status };
            newStatusObj[mem] = nextStatus;
            await setDoc(doc(db, "settings", currentFamily), { status: newStatusObj }, { merge: true });
        };

        function renderDropdowns() {
            categorySelect.innerHTML = "";
            familySettings.categories.forEach(cat => categorySelect.innerHTML += `<option value="${cat.name}">${cat.name}</option>`);
            filterSelect.innerHTML = `<option value="all">Filtra: Tutti</option>`;
            familySettings.categories.forEach(cat => filterSelect.innerHTML += `<option value="${cat.name}">Filtro: ${cat.name}</option>`);
            
            const assignContainer = document.getElementById('assign-who-container');
            assignContainer.innerHTML = '';
            familySettings.members.forEach(mem => {
                const chip = document.createElement('div');
                chip.className = 'chip'; chip.innerText = mem;
                chip.onclick = () => chip.classList.toggle('active');
                assignContainer.appendChild(chip);
            });
        }

        window.editItem = (id, section) => {
            if(currentSection === 'dashboard') { editingItem = dashboardData[section].find(x => x.id === id); } 
            else { editingItem = allDataCache.find(x => x.id === id); }
            if(!editingItem) return;
            
            editingItemSection = section;
            newItemInput.value = editingItem.text || "";
            if (section === 'calendar' || section === 'todos') {
                dateInput.value = editingItem.date || "";
                if(section === 'calendar') {
                    timeInput.value = editingItem.time || "";
                    locationInput.value = editingItem.location || "";
                }
                categorySelect.value = editingItem.category || "";
            }
            if (section === 'contacts') contactInput.value = editingItem.detail || "";
            
            document.querySelectorAll('#assign-who-container .chip').forEach(c => c.classList.remove('active'));
            let tags = section === 'chat' ? editingItem.tagged : editingItem.assigned;
            if (tags) {
                if (!Array.isArray(tags)) tags = [tags];
                document.querySelectorAll('#assign-who-container .chip').forEach(c => {
                    if(tags.includes(c.innerText)) c.classList.add('active');
                });
            }
            
            document.querySelector('#add-btn span').innerText = 'done';
            document.querySelector('#add-btn').classList.add('edit-mode');
            recurrenceWrapper.classList.add('hidden'); 
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.setAgendaView = (mode) => {
            const btnList = document.getElementById('btn-view-list');
            const btnCal = document.getElementById('btn-view-cal');
            if(mode === 'calendar') {
                isCalendarMode = true;
                calendarViewContainer.classList.remove('hidden');
                btnCal.classList.add('active'); btnList.classList.remove('active');
                renderCalendarGrid();
            } else {
                isCalendarMode = false; selectedDate = null;
                calendarViewContainer.classList.add('hidden');
                btnList.classList.add('active'); btnCal.classList.remove('active');
                renderList();
            }
        };

        window.nav = (section) => {
            if(isBulkMode) window.toggleBulkMode(); 
            
            editingItem = null; editingItemSection = null;
            document.querySelector('#add-btn span').innerText = 'add';
            document.querySelector('#add-btn').classList.remove('edit-mode');
            
            currentSection = section;
            listContainer.innerHTML = '';
            
            settingsView.classList.add('hidden');
            addBarContainer.classList.add('hidden');
            noteEditorContainer.classList.add('hidden');
            calendarViewContainer.classList.add('hidden');
            agendaViewToggle.classList.add('hidden');
            document.querySelector('.filter-row').classList.add('hidden');
            
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
            if(event && event.currentTarget) event.currentTarget.classList.add('active'); 
            else document.querySelector(`.nav-item[onclick="window.nav('${section}')"]`).classList.add('active');

            if (section === 'settings') { settingsView.classList.remove('hidden'); document.getElementById('page-title').innerText = "Impostazioni"; return; }
            if (section === 'dashboard') { document.getElementById('page-title').innerText = "Home"; loadDashboardData(); return; }

            document.querySelector('.filter-row').classList.remove('hidden');
            if(section === 'chat' || section === 'contacts' || section === 'notes') document.querySelector('.filter-row').classList.add('hidden');
            
            dateInput.classList.add('hidden'); timeInput.classList.add('hidden'); recurrenceWrapper.classList.add('hidden'); 
            recUnit.value = 'none'; window.toggleRecurrenceInputs(); 
            
            categorySelect.classList.add('hidden'); contactInput.classList.add('hidden'); locationInput.classList.add('hidden');
            document.getElementById('assign-who-container').classList.add('hidden');
            newItemInput.placeholder = "Aggiungi nuovo...";
            const title = document.getElementById('page-title');

            if (section === 'notes') {
                noteEditorContainer.classList.remove('hidden'); title.innerText = "Note";
                noteTitleInput.value = ""; noteContentInput.value = ""; editingNoteId.value = "";
                document.getElementById('save-note-btn').innerText = "Salva Nota";
            } else {
                addBarContainer.classList.remove('hidden'); 
                
                if(section === 'calendar' || section === 'todos' || section === 'chat' || section === 'shopping') {
                    document.getElementById('assign-who-container').classList.remove('hidden');
                    document.querySelectorAll('#assign-who-container .chip').forEach(c => c.classList.remove('active'));
                }

                if(section === 'calendar') {
                    title.innerText = "Agenda"; agendaViewToggle.classList.remove('hidden');
                    dateInput.classList.remove('hidden'); timeInput.classList.remove('hidden'); recurrenceWrapper.classList.remove('hidden'); 
                    categorySelect.classList.remove('hidden'); categorySelect.style.display = 'block'; locationInput.classList.remove('hidden'); 
                    newItemInput.placeholder = "Titolo evento...";
                    if(isCalendarMode) calendarViewContainer.classList.remove('hidden'); 
                } 
                else if (section === 'todos') {
                    title.innerText = "Compiti"; dateInput.classList.remove('hidden'); 
                    categorySelect.classList.remove('hidden'); categorySelect.style.display = 'block'; 
                    newItemInput.placeholder = "Cosa c'è da fare?";
                }
                else if (section === 'chat') {
                    title.innerText = "Messaggi"; newItemInput.placeholder = "Scrivi un messaggio...";
                }
                else if (section === 'contacts') {
                    title.innerText = "Rubrica"; contactInput.classList.remove('hidden'); newItemInput.placeholder = "Nome contatto...";
                } 
                else if (section === 'shopping') { 
                    title.innerText = "Spesa"; newItemInput.placeholder = "Cosa manca?"; 
                }
            }
            loadData(section);
        };

        function isAssignedToUser(itemField, user) {
            if(!user) return true; 
            if(!itemField || itemField.length === 0) return true; 
            if(Array.isArray(itemField)) return itemField.includes(user);
            return itemField === user; 
        }

        // --- DASHBOARD (RIORGANIZZATA) ---
        function loadDashboardData() {
            listContainer.innerHTML = '<div style="text-align:center; padding:40px; color:var(--text-sub);">Organizzazione in corso...</div>';
            clearSubscribes();
            const cols = ['calendar', 'chat', 'todos', 'shopping'];
            
            cols.forEach(col => {
                const unsub = onSnapshot(query(collection(db, `${currentFamily}_${col}`)), (snap) => {
                    dashboardData[col] = [];
                    snap.forEach(d => dashboardData[col].push({id: d.id, ...d.data()}));
                    if(currentSection === 'dashboard') renderDashboard();
                });
                unsubscribes.push(unsub);
            });
        }

        function renderDashboard() {
            if(currentSection !== 'dashboard') return;
            
            // STATUS
            let statusHtml = `<div class="dash-section-title"><span class="material-symbols-outlined" style="color:var(--primary)">home_pin</span> Presenze</div><div class="status-container">`;
            familySettings.members.forEach(m => {
                const isHome = familySettings.status[m] === 'home';
                const cls = isHome ? 'is-home' : 'is-out';
                statusHtml += `<div class="status-chip ${cls}" onclick="window.toggleStatus('${m}')">${m}</div>`;
            });
            statusHtml += `</div>`;

            let userOpts = `<option value="">Vista Generale: Tutti</option>`;
            familySettings.members.forEach(m => userOpts += `<option value="${m}" ${m===currentDashboardUser?'selected':''}>Focus su: ${m}</option>`);

            let html = statusHtml + `<div class="dash-header-select"><select onchange="window.changeDashUser(this.value)">${userOpts}</select></div>`;

            const today = new Date().toISOString().split('T')[0];
            const next7 = new Date(); next7.setDate(next7.getDate() + 7);
            const limitDate = next7.toISOString().split('T')[0];

            // 1. MESSAGGI (BACHECA)
            if(currentDashboardUser) {
                const chatForMe = dashboardData.chat.filter(c => isAssignedToUser(c.tagged, currentDashboardUser)).sort((a,b)=> b.timestamp - a.timestamp);
                if(chatForMe.length > 0) {
                    html += `<div class="dash-section-title"><span class="material-symbols-outlined" style="color:var(--warning)">notifications_active</span> Nuovi Messaggi</div>`;
                    chatForMe.forEach(c => html += renderHTMLCard(c, 'chat'));
                }
            }

            // 2. COMPITI
            const tasks = dashboardData.todos.filter(t => !t.done && (!t.date || t.date <= limitDate) && isAssignedToUser(t.assigned, currentDashboardUser)).sort((a,b)=> (a.date||'9999') > (b.date||'9999') ? 1 : -1);
            if(tasks.length > 0) {
                html += `<div class="dash-section-title"><span class="material-symbols-outlined" style="color:var(--primary)">task_alt</span> Compiti (Entro 7gg)</div>`;
                tasks.slice(0, 5).forEach(c => html += renderHTMLCard(c, 'todos'));
            }

            // 3. SPESA
            const shop = dashboardData.shopping.filter(s => !s.done && isAssignedToUser(s.assigned, currentDashboardUser));
            if(shop.length > 0) {
                html += `<div class="dash-section-title"><span class="material-symbols-outlined" style="color:var(--primary)">shopping_basket</span> Lista della Spesa</div>`;
                shop.slice(0, 5).forEach(c => html += renderHTMLCard(c, 'shopping'));
            }

            // 4. AGENDA (Scaduti + Futuri)
            const impegni = dashboardData.calendar.filter(c => !c.done);
            const scaduti = impegni.filter(c => c.date && c.date < today);
            if(scaduti.length > 0) {
                html += `<div class="dash-section-title"><span class="material-symbols-outlined" style="color:var(--alert)">error</span> Appuntamenti Scaduti</div>`;
                scaduti.forEach(c => html += renderHTMLCard(c, 'calendar'));
            }

            const futuri = impegni.filter(c => c.date >= today && c.date <= limitDate).sort((a,b)=> (a.date||'9999') > (b.date||'9999') ? 1 : -1);
            if(futuri.length > 0) {
                html += `<div class="dash-section-title"><span class="material-symbols-outlined" style="color:var(--primary)">event_upcoming</span> Agenda (Prossimi 7gg)</div>`;
                futuri.forEach(c => html += renderHTMLCard(c, 'calendar'));
            }

            if(html.indexOf('dash-section-title') === html.lastIndexOf('dash-section-title')) { 
                // Se c'è solo il titolo "Presenze"
                html += `<div style="text-align:center; padding:50px 20px; color:var(--text-sub); font-style:italic;">Nessuna attività pendente per i prossimi giorni.</div>`;
            }

            listContainer.innerHTML = html;
        }

        function clearSubscribes() { unsubscribes.forEach(u => u()); unsubscribes = []; }

        function loadData(section) {
            listContainer.innerHTML = '<div style="text-align:center; padding:40px; color:var(--text-sub);">Recupero dati...</div>';
            clearSubscribes();
            if (!currentFamily) return;
            const col = `${currentFamily}_${section}`;
            let q = (section === 'calendar') ? query(collection(db, col), orderBy("date", "asc")) : query(collection(db, col), orderBy("timestamp", "desc"));
            
            const unsub = onSnapshot(q, (snap) => {
                allDataCache = []; snap.forEach(d => allDataCache.push({id:d.id, ...d.data()}));
                if(isCalendarMode && section === 'calendar') renderCalendarGrid();
                renderList();
            });
            unsubscribes.push(unsub);
        }

        window.applyFilter = () => renderList();

        function renderList() {
            listContainer.innerHTML = "";
            const filter = filterSelect.value;
            let filtered = allDataCache.filter(i => {
                const catMatch = filter === 'all' || i.category === filter;
                const dateMatch = !selectedDate || i.date === selectedDate || currentSection !== 'calendar';
                return catMatch && dateMatch;
            });
            
            if(filtered.length === 0) listContainer.innerHTML = "<div style='text-align:center; color:var(--text-sub); margin-top:40px;'>Elenco vuoto.</div>";
            let scrolled = false; const today = new Date().toISOString().split('T')[0];

            filtered.forEach(data => {
                if (currentSection === 'calendar' && !scrolled && data.date >= today && !selectedDate) {
                    const wrap = document.createElement('div'); wrap.id = "scroll-target"; 
                    wrap.innerHTML = renderHTMLCard(data, currentSection, (data.date === today));
                    listContainer.appendChild(wrap);
                    scrolled = true;
                } else {
                    const temp = document.createElement('div'); temp.innerHTML = renderHTMLCard(data, currentSection);
                    listContainer.appendChild(temp.firstChild);
                }
            });
            if(currentSection === 'calendar' && !selectedDate) {
                setTimeout(() => { const el = document.getElementById('scroll-target'); if(el) el.scrollIntoView({behavior: "smooth", block: "center"}); }, 300);
            }
        }

        function renderHTMLCard(data, sectionType, isToday = false) {
            const seriesIdSafe = data.seriesId ? `'${data.seriesId}'` : 'null';
            const checkboxHtml = `<input type="checkbox" class="bulk-checkbox" value="${data.id}" data-section="${sectionType}" onclick="window.updateBulkCount()">`;
            
            let assignedTags = "";
            if (Array.isArray(data.assigned) && data.assigned.length > 0) { assignedTags = data.assigned.map(m => `<span class="assigned-badge">@${m}</span>`).join(" "); } 
            else if (typeof data.assigned === 'string' && data.assigned) { assignedTags = `<span class="assigned-badge">@${data.assigned}</span>`; }

            let chatTags = "";
            if (Array.isArray(data.tagged) && data.tagged.length > 0) { chatTags = data.tagged.map(m => `<div class="chat-tag">@${m}</div>`).join(" "); } 
            else if (typeof data.tagged === 'string' && data.tagged) { chatTags = `<div class="chat-tag">@${data.tagged}</div>`; }
            
            const editAction = `<span class="material-symbols-outlined" style="color:var(--warning); margin-left:15px; cursor:pointer;" onclick="window.editItem('${data.id}','${sectionType}')">edit</span>`;
            const deleteAction = `<span class="material-symbols-outlined" style="color:var(--alert); margin-left:15px; cursor:pointer;" onclick="window.del('${data.id}','${sectionType}', ${seriesIdSafe})">delete</span>`;

            if (sectionType === 'notes') {
                return `<div class="card note-card" style="flex-direction:row;">${checkboxHtml}<div style="width:100%"><div class="note-title">${data.title||"Senza titolo"}</div><div class="note-body">${data.text}</div><div class="note-footer">${editAction} ${deleteAction}</div></div></div>`;
            }
            if (sectionType === 'chat') {
                const timeStr = data.timestamp ? data.timestamp.toDate().toLocaleString('it-IT', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'}) : '';
                return `<div class="card chat-card">${checkboxHtml}<div style="width:100%;"><div style="display:flex; justify-content:space-between; margin-bottom:5px;"><span class="chat-author">${data.author}</span> <span class="chat-time">${timeStr}</span></div><div style="font-size:1rem; white-space:pre-wrap; margin-bottom:5px;">${data.text}</div><div>${chatTags}</div></div> <div style="display:flex; flex-direction:column; gap:15px;">${editAction} ${deleteAction}</div></div>`;
            }

            const catObj = familySettings.categories.find(c => c.name === data.category);
            const color = catObj ? catObj.color : '#ccc';
            
            let content = "", actions = "";
            const strike = data.done ? 'text-decoration:line-through; color:var(--text-sub); opacity:0.6;' : '';
            const checkIcon = data.done ? 'check_circle' : 'radio_button_unchecked';
            const checkColor = data.done ? 'var(--primary)' : 'var(--border)';

            if (sectionType === 'calendar') {
                const d = data.date ? new Date(data.date) : new Date();
                const timeDisplay = data.time ? `<span class="time-display">${data.time}</span>` : "";
                const dStr = data.date || new Date().toISOString().split('T')[0];
                actions = `<span class="material-symbols-outlined" style="color:var(--text-sub); margin-left:10px; cursor:pointer;" onclick="window.exportGoogle('${data.text}','${dStr}')">calendar_add_on</span>`;
                const locHtml = data.location ? `<br><a href="https://maps.google.com/?q=${encodeURIComponent(data.location)}" target="_blank" class="location-link"><span class="material-symbols-outlined" style="font-size:16px; margin-right:4px;">location_on</span> ${data.location}</a>` : '';

                content = `<span class="material-symbols-outlined" style="color:${checkColor}; margin-right:15px; cursor:pointer; font-size:26px;" onclick="window.toggle('${data.id}',${!data.done},'${sectionType}')">${checkIcon}</span>
                           <div class="date-badge" style="${data.done?'opacity:0.5;':''}"><span class="date-day">${d.getDate()}</span><span class="date-month">${d.toLocaleString('it-IT',{month:'short'})}</span></div>
                           <div style="flex-grow:1; ${strike}"><div style="font-weight:600; font-size:1.05rem; margin-bottom:6px;">${timeDisplay}${data.text}</div>
                           <div style="font-size:0.8rem; color:var(--text-sub);"><span class="cat-dot" style="background:${color}"></span>${data.category||'Generale'} ${assignedTags}</div>${locHtml}</div>`;
            } 
            else if (sectionType === 'contacts') {
                content = `<div style="flex-grow:1"><div style="font-weight:600; font-size:1.1rem;">${data.text}</div><a href="tel:${data.detail}" style="color:var(--primary); text-decoration:none; display:flex; align-items:center; margin-top:8px;"><span class="material-symbols-outlined" style="font-size:18px; margin-right:6px;">call</span> ${data.detail}</a></div>`;
            } 
            else {
                let dateHtml = "";
                if(data.date && sectionType === 'todos') {
                    const dd = new Date(data.date); dateHtml = `<span class="due-date-display">Entro il: ${dd.getDate()}/${dd.getMonth()+1}</span>`;
                }
                content = `<span class="material-symbols-outlined" style="color:${checkColor}; margin-right:15px; cursor:pointer; font-size:26px;" onclick="window.toggle('${data.id}',${!data.done},'${sectionType}')">${checkIcon}</span>
                           <div style="flex-grow:1; ${strike}"><span class="cat-dot" style="background:${color}"></span><span style="font-weight:500;">${data.text}</span> ${assignedTags} ${dateHtml}</div>`;
            }

            const todayCls = isToday ? 'today-card' : '';
            return `<div class="card ${todayCls}">${checkboxHtml}${content} <div style="display:flex; align-items:center;">${actions}${editAction}${deleteAction}</div></div>`;
        }

        function renderCalendarGrid() {
            const grid = document.getElementById('cal-grid-days'); const monthName = document.getElementById('cal-month-name'); grid.innerHTML = "";
            const days = ["L", "M", "M", "G", "V", "S", "D"]; days.forEach(d => grid.innerHTML += `<div class="cal-day-name">${d}</div>`);
            const year = viewDate.getFullYear(); const month = viewDate.getMonth();
            monthName.innerText = viewDate.toLocaleString('it-IT', { month: 'long', year: 'numeric' }).toUpperCase();
            const firstDay = new Date(year, month, 1).getDay(); const daysInMonth = new Date(year, month + 1, 0).getDate();
            const startOffset = firstDay === 0 ? 6 : firstDay - 1;
            for(let i=0; i<startOffset; i++) grid.innerHTML += `<div class="cal-day empty"></div>`;
            const todayStr = new Date().toISOString().split('T')[0];
            
            for(let i=1; i<=daysInMonth; i++) {
                const dStr = `${year}-${String(month+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
                const dayEvents = allDataCache.filter(ev => ev.date === dStr && !ev.done); // Mostra pallini solo per impegni NON completati
                const uniqueCategories = [...new Set(dayEvents.map(e => e.category))];
                let dotsHtml = `<div class="cal-dots-container">`;
                uniqueCategories.forEach(catName => { const catObj = familySettings.categories.find(c => c.name === catName); const color = catObj ? catObj.color : '#ccc'; dotsHtml += `<div class="cal-dot" style="background:${color}"></div>`; });
                dotsHtml += `</div>`;
                const isToday = dStr === todayStr ? 'today' : ''; const isSelected = selectedDate === dStr ? 'selected' : '';
                const div = document.createElement('div'); div.className = `cal-day ${isToday} ${isSelected}`; div.innerHTML = `<span>${i}</span>${dotsHtml}`;
                div.onclick = () => { selectedDate = dStr; renderCalendarGrid(); renderList(); };
                grid.appendChild(div);
            }
        }

        function renderSettingsView() {
            const memList = document.getElementById('members-list'); memList.innerHTML = "";
            familySettings.members.forEach((mem, i) => memList.innerHTML += `<div class="settings-row"><span>${mem}</span><span class="material-symbols-outlined" style="color:var(--alert); cursor:pointer;" onclick="window.removeMember(${i})">delete</span></div>`);
            const catList = document.getElementById('categories-list'); catList.innerHTML = "";
            familySettings.categories.forEach((cat, i) => catList.innerHTML += `<div class="settings-row"><div style="display:flex;align-items:center"><span style="width:16px;height:16px;background:${cat.color};border-radius:50%;margin-right:12px;"></span>${cat.name}</div><span class="material-symbols-outlined" style="color:var(--alert); cursor:pointer;" onclick="window.removeCategory(${i})">delete</span></div>`);
        }
        window.addMember = async () => { const n = document.getElementById('new-member-name').value; if(n){familySettings.members.push(n); await saveSettings(); document.getElementById('new-member-name').value="";}};
        window.removeMember = async (i) => { if(confirm("Eliminare il membro dalla lista?")){familySettings.members.splice(i,1); await saveSettings();}};
        window.addCategory = async () => { const n = document.getElementById('new-cat-name').value; const c=document.getElementById('new-cat-color').value; if(n){familySettings.categories.push({name:n, color:c}); await saveSettings(); document.getElementById('new-cat-name').value="";}};
        window.removeCategory = async (i) => { if(confirm("Eliminare la categoria?")){familySettings.categories.splice(i,1); await saveSettings();}};

        document.getElementById('add-btn').addEventListener('click', async () => {
            const txt = newItemInput.value; if(!txt) return;
            const cat = categorySelect.value; 
            let dVal = dateInput.value; const tVal = timeInput.value; 
            const locVal = locationInput.value;
            const who = Array.from(document.querySelectorAll('#assign-who-container .chip.active')).map(c => c.innerText);
            
            if (editingItem) {
                if(editingItemSection === 'chat') {
                    await updateDoc(doc(db, `${currentFamily}_chat`, editingItem.id), { text: txt, tagged: who });
                } else {
                    let updates = { text: txt, category: cat, assigned: who };
                    if (editingItemSection === 'calendar' || editingItemSection === 'todos') updates.date = dVal;
                    if (editingItemSection === 'calendar') { updates.time = tVal; updates.location = locVal; }
                    if (editingItemSection === 'contacts') updates.detail = contactInput.value;
                    
                    if (editingItemSection === 'calendar' && editingItem.seriesId) {
                        const ans = prompt("Digita 1 per modificare SOLO QUESTO evento.\nDigita 2 per modificare TUTTA LA SERIE FUTURA.\n(Lascia vuoto per annullare)");
                        if (ans === '2') {
                            const q = query(collection(db, `${currentFamily}_${editingItemSection}`), where("seriesId", "==", editingItem.seriesId));
                            const snap = await getDocs(q);
                            snap.forEach(d => { if (d.data().date >= editingItem.date) updateDoc(d.ref, { text: txt, category: cat, assigned: who, time: tVal, location: locVal }); });
                            await updateDoc(doc(db, `${currentFamily}_${editingItemSection}`, editingItem.id), updates);
                        } else if (ans === '1') { await updateDoc(doc(db, `${currentFamily}_${editingItemSection}`, editingItem.id), updates); } 
                        else { return; }
                    } else { await updateDoc(doc(db, `${currentFamily}_${editingItemSection}`, editingItem.id), updates); }
                }
                
                editingItem = null; editingItemSection = null;
                document.querySelector('#add-btn span').innerText = 'add';
                document.querySelector('#add-btn').classList.remove('edit-mode');
                newItemInput.value=""; contactInput.value=""; locationInput.value=""; 
                document.querySelectorAll('#assign-who-container .chip').forEach(c => c.classList.remove('active'));
                if (currentSection === 'calendar') { recurrenceWrapper.classList.remove('hidden'); window.toggleRecurrenceInputs(); }
                return;
            }

            if(currentSection === 'chat') {
                const authorName = auth.currentUser.email.split('@')[0];
                await addDoc(collection(db, `${currentFamily}_chat`), { text: txt, timestamp: serverTimestamp(), author: authorName, tagged: who });
                newItemInput.value=""; document.querySelectorAll('#assign-who-container .chip').forEach(c => c.classList.remove('active')); return;
            }

            let loops = 1;
            const rUnit = recUnit.value;
            const rInt = parseInt(recInterval.value) || 1;
            const rCount = parseInt(recCount.value) || 1;
            if(currentSection === 'calendar' && rUnit !== 'none') loops = rCount;
            
            const selectedDays = Array.from(document.querySelectorAll('.day-chip.active')).map(c => parseInt(c.dataset.day));
            let isMultiple = (loops > 1) || (rUnit === 'week' && selectedDays.length > 0 && rCount > 0);
            const seriesId = isMultiple ? Date.now().toString(36) + Math.random().toString(36).substr(2, 5) : null;
            
            if(currentSection === 'calendar' && rUnit === 'week' && selectedDays.length > 0) {
                if(!dVal) return alert("Seleziona la data del primo evento sul calendario.");
                const baseDate = new Date(dVal);
                for (let w = 0; w < rCount; w++) {
                    for (let dayOfWeek of selectedDays) {
                        let d = new Date(baseDate);
                        let currentDayOfWeek = d.getDay(); 
                        let dayOffset = dayOfWeek - currentDayOfWeek;
                        d.setDate(d.getDate() + dayOffset + (w * rInt * 7));
                        if (w === 0 && d < baseDate) continue; 
                        const item = { text: txt, timestamp: serverTimestamp(), done: false, category: cat, assigned: who, time: tVal, seriesId: seriesId };
                        if(locVal) item.location = locVal; item.date = d.toISOString().split('T')[0];
                        await addDoc(collection(db, `${currentFamily}_${currentSection}`), item);
                    }
                }
            } else {
                for(let i=0; i<loops; i++) {
                    const item = { text: txt, timestamp: serverTimestamp(), done: false, category: cat, assigned: who };
                    if (seriesId) item.seriesId = seriesId;
                    if(currentSection === 'calendar') {
                        if(!dVal) return alert("Data mancante.");
                        item.time = tVal; if(locVal) item.location = locVal;
                        if (i > 0) {
                            const d = new Date(dVal);
                            if(rUnit === 'day') d.setDate(d.getDate() + (i * rInt));
                            if(rUnit === 'week') d.setDate(d.getDate() + (i * rInt * 7));
                            if(rUnit === 'month') d.setMonth(d.getMonth() + (i * rInt));
                            if(rUnit === 'year') d.setFullYear(d.getFullYear() + (i * rInt));
                            item.date = d.toISOString().split('T')[0];
                        } else { item.date = dVal; }
                    } else if(currentSection === 'todos') { if(dVal) item.date = dVal; } 
                    else if(currentSection === 'contacts') { item.detail = contactInput.value || ""; }
                    await addDoc(collection(db, `${currentFamily}_${currentSection}`), item);
                    if(currentSection !== 'calendar') break; 
                }
            }
            
            newItemInput.value=""; contactInput.value=""; locationInput.value=""; 
            recUnit.value="none"; window.toggleRecurrenceInputs();
            document.querySelectorAll('#assign-who-container .chip').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.day-chip.active').forEach(c => c.classList.remove('active'));
        });

        document.getElementById('save-note-btn').addEventListener('click', async () => {
            const title = noteTitleInput.value; const content = noteContentInput.value; const editId = editingNoteId.value;
            if(!content) return alert("Inserisci il contenuto della nota.");
            if (editId) { await updateDoc(doc(db, `${currentFamily}_notes`, editId), { title: title, text: content, timestamp: serverTimestamp() }); editingNoteId.value = ""; document.getElementById('save-note-btn').innerText = "Salva Nota"; } 
            else { await addDoc(collection(db, `${currentFamily}_notes`), { title: title, text: content, timestamp: serverTimestamp() }); }
            noteTitleInput.value = ""; noteContentInput.value = "";
        });

        window.del = async (id, section, seriesId) => {
            if(seriesId && seriesId !== 'null') {
                const ans = prompt("Digita 1 per eliminare SOLO QUESTO evento.\nDigita 2 per eliminare TUTTA LA SERIE.\n(Lascia vuoto per annullare)");
                if (ans === '1') { await deleteDoc(doc(db, `${currentFamily}_${section}` , id)); } 
                else if (ans === '2') {
                    const q = query(collection(db, `${currentFamily}_${section}`), where("seriesId", "==", seriesId));
                    const snap = await getDocs(q); snap.forEach(d => deleteDoc(d.ref));
                }
            } else { if(confirm("Confermi l'eliminazione definitiva?")) await deleteDoc(doc(db, `${currentFamily}_${section}` , id)); }
        };

        window.toggle = async (id, st, section) => { await updateDoc(doc(db, `${currentFamily}_${section}`, id), {done:st}); };
        window.editNote = (id) => { const note = allDataCache.find(n => n.id === id); if (note) { noteTitleInput.value = note.title || ""; noteContentInput.value = note.text || ""; editingNoteId.value = id; document.getElementById('save-note-btn').innerText = "Aggiorna Nota"; window.scrollTo({ top: 0, behavior: 'smooth' });}};
        window.exportGoogle = (t,d) => { const x=d.replace(/-/g,''); window.open(`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(t)}&dates=${x}/${x}`,'_blank');};

    </script>
    
    <script>
        if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js'); }); }
    </script>
</body>
</html>
